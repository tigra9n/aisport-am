name: Verify New Architecture

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-new-arch.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check several matches
        run: |
          echo 'import json' > /tmp/s.py
          echo 'd=json.load(open("/tmp/p.json"))' >> /tmp/s.py
          echo 'print("lineups:", len(d.get("lineups",[])), "stats:", len(d.get("statistics",[])), "events:", len(d.get("events",[])))' >> /tmp/s.py
          for MID in af-1570344 af-1557375 af-1557374 af-1550091; do
            echo "=== $MID ===" >> verify-arch.txt
            curl -s "https://aisport.am/api/live/match/$MID?_c=$(date +%s)$RANDOM" > /tmp/p.json
            python3 /tmp/s.py >> verify-arch.txt
          done
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f verify-arch.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
