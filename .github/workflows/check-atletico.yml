name: Check Atletico Match

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-atletico.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo 'import json' > /tmp/s.py
          echo 'd=json.load(open("/tmp/p.json"))' >> /tmp/s.py
          echo 'print(json.dumps(d, ensure_ascii=False)[:800])' >> /tmp/s.py
          echo "=== Our popup for af-1570344 ===" > check-atletico.txt
          curl -s "https://aisport.am/api/live/match/af-1570344?_c=$(date +%s)" > /tmp/p.json
          python3 /tmp/s.py >> check-atletico.txt
          echo "" >> check-atletico.txt
          echo "=== Raw lineups for 1570344 ===" >> check-atletico.txt
          curl -s "https://v3.football.api-sports.io/fixtures/lineups?fixture=1570344" -H "x-apisports-key: ${AFKEY}" | head -c 400 >> check-atletico.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f check-atletico.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
