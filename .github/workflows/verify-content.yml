name: Verify Content Generation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-content.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Trigger content generation and check
        run: |
          echo "=== Triggering /api/cron/content ===" > verify-content.txt
          curl -s "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}" >> verify-content.txt
          echo "" >> verify-content.txt
          echo "=== Homepage articles check ===" >> verify-content.txt
          curl -s "https://aisport.am/api/articles?_c=$(date +%s)" | head -c 1500 >> verify-content.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f verify-content.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
