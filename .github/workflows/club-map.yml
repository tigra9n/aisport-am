# The map between the two providers' club numbers.
#
# WHY THIS EXISTS, and why it exists NOW rather than later.
#
# Four things on this site still read the paid provider: squads, player
# pages, top scorers and team pages. ESPN has all four for nothing -
# measured on 6 September, not assumed - but every one of those pages
# lives behind a URL numbered by API-Sports. /team/49 is Chelsea because
# API-Sports says 49; ESPN calls the same club 363. (This comment said 50
# until the first run printed the real rows: 50 is Manchester City, whose
# ESPN number is 382. An example invented from memory is exactly the kind
# of thing this workflow exists to stop being done to a URL.) Those URLs
# are the ones Google has been indexing. Swapping the source without a map between
# the two numberings would point every indexed team and player page at a
# different footballer, which is worse than losing the pages.
#
# So the map is the work, not the reading. And it can only be built while
# BOTH providers answer: the paid plan ends on 23 September, and after
# that there is nothing left to compare against. That is the whole reason
# this runs in the first week of September.
#
# HOW IT AVOIDS A WRONG ROW, which is the only thing that matters here.
#
# The rule is in lib/club-match.ts, where it is unit-tested, and it is
# this: the name decides nothing. Every club in the league is scored on
# how many surnames its published squad shares with the club being
# matched, and a row is written only when one club shares at least four
# and no other club shares as many. Two different clubs do not share four
# players.
#
# An unmatched club is not a failure of this job, it is its output: the
# run prints them by name so they can be resolved by hand, exactly the way
# the twenty-six clubs the photograph workflow could not match were.
#
# Nothing here touches the deployed site. It writes a file, commits it to
# its own branch and opens one pull request.
name: Club map

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated codes, or all"
        required: false
        default: "all"

jobs:
  map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: aisport-am
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund

      - name: Match every club at both providers, and make each pair prove it
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LEAGUES: ${{ inputs.leagues }}
        run: |
          # Yesterday's rows, before today's are proved.
          #
          # The map is meant to accumulate - a club proved in an earlier
          # run keeps its row, and a row corrected by hand is never
          # overwritten - but the script reads what it is accumulating on
          # to from the working tree, and a scheduled checkout is of the
          # default branch, which does not carry this file. So the branch's
          # copy is fetched first. Without this the "add, never replace"
          # rule quietly becomes "replace".
          # Seeded from main, not from this job's own branch.
          #
          # It used to read claude/club-map, which made that branch load
          # bearing: deleting it - an obvious tidy-up, since every row on
          # it has been merged - would have quietly reset the map to empty
          # on the next run, and the "add, never replace" rule with it.
          # main is where the reviewed rows live and where a hand
          # correction lands, so main is what a new run should build on.
          for ref in origin/main origin/claude/club-map; do
            git fetch origin "${ref#origin/}" 2>/dev/null || true
            for f in team-map player-map coach-map; do
              git show "$ref:aisport-am/lib/$f.ts" > "lib/$f.ts" 2>/dev/null || true
            done
            if [ -s lib/team-map.ts ]; then
              echo "starting from $ref: $(grep -c '": "' lib/team-map.ts) clubs, $(grep -c '": "' lib/player-map.ts 2>/dev/null || echo 0) footballers"
              break
            fi
          done
          cat > map.mts <<'TS'
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          import { chooseAthlete, chooseClub, surnameSet } from "./lib/club-match.ts";

          const KEY = process.env.API_FOOTBALL_KEY || "";
          if (!KEY) { console.log("no API_FOOTBALL_KEY"); process.exit(1); }

          // Armenia is not here on purpose: ESPN's list of 218 soccer
          // leagues does not contain the Armenian Premier League, so there
          // is no ESPN club to map an Armenian club onto. That gap is real
          // and is not this job's to close.
          const LEAGUES = [
            { code: "CL",  af: 2,   espn: "uefa.champions" },
            { code: "EL",  af: 3,   espn: "uefa.europa" },
            { code: "ECL", af: 848, espn: "uefa.europa.conf" },
            { code: "PL",  af: 39,  espn: "eng.1" },
            { code: "PD",  af: 140, espn: "esp.1" },
            { code: "SA",  af: 135, espn: "ita.1" },
            { code: "BL1", af: 78,  espn: "ger.1" },
            { code: "FL1", af: 61,  espn: "fra.1" },
            { code: "SPL", af: 307, espn: "ksa.1" },
            { code: "MLS", af: 253, espn: "usa.1" },
          ];
          const asked = (process.env.LEAGUES || "all").trim().toUpperCase();
          const only = !asked || asked === "ALL"
            ? LEAGUES
            : LEAGUES.filter((l) => asked.split(",").map((s) => s.trim()).includes(l.code));

          const now = new Date();
          const season = now.getUTCMonth() + 1 >= 7 ? now.getUTCFullYear() : now.getUTCFullYear() - 1;
          const wait = (ms: number) => new Promise((r) => setTimeout(r, ms));

          const af = async (path: string) => {
            // 400ms between calls. The paid plan allows far more per
            // minute; the photograph workflow settled on this pace and was
            // never throttled at it.
            await wait(400);
            const res = await fetch(`https://v3.football.api-sports.io${path}`, {
              headers: { "x-apisports-key": KEY, Accept: "application/json" },
              signal: AbortSignal.timeout(20000),
            });
            const json = await res.json() as { errors?: unknown; response?: unknown };
            // api-sports answers 200 with an errors object when it is
            // refusing - a rate limit, an expired plan - and results: 0.
            // Reading that as "this club has no squad" is how an afternoon
            // was once spent; here it stops the run, because a refusal
            // would quietly become an unmatched club and an unmatched club
            // reads like a naming problem.
            const errors = json?.errors;
            if (errors && !Array.isArray(errors) && typeof errors === "object" && Object.keys(errors).length) {
              throw new Error(`api-sports refused: ${JSON.stringify(errors)}`);
            }
            return json;
          };

          const espn = async (url: string) => {
            try {
              const res = await fetch(url, { headers: { Accept: "application/json" }, signal: AbortSignal.timeout(20000) });
              if (!res.ok) return null;
              return await res.json();
            } catch { return null; }
          };

          const map: Record<string, string> = {};
          const unmatched: string[] = [];
          const proved: string[] = [];
          const perLeague: string[] = [];
          const players: Record<string, string> = {};
          let playersProved = 0;
          let playersRefused = 0;
          const coaches: Record<string, string> = {};

          for (const league of only) {
            console.log(`\n=== ${league.code}  (api-football ${league.af}, espn ${league.espn}, season ${season})`);
            const teamsPayload = await af(`/teams?league=${league.af}&season=${season}`) as { response?: { team?: { id?: number; name?: string } }[] };
            const afTeams = (teamsPayload.response ?? [])
              .map((row) => ({ id: row.team?.id, name: row.team?.name }))
              .filter((t): t is { id: number; name: string } => typeof t.id === "number" && !!t.name);

            const espnList = await espn(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league.espn}/teams`) as
              { sports?: { leagues?: { teams?: { team?: { id?: string | number; displayName?: string; name?: string } }[] }[] }[] } | null;
            const espnTeams = (espnList?.sports?.[0]?.leagues?.[0]?.teams ?? [])
              .map((entry) => entry.team)
              .filter(Boolean)
              .map((t) => ({ id: String(t!.id), name: t!.displayName || t!.name || "" }));

            console.log(`    ${afTeams.length} clubs at api-football, ${espnTeams.length} at espn`);
            if (!afTeams.length || !espnTeams.length) { console.log("    one side is empty - skipping rather than guessing"); continue; }

            // Every roster is fetched once and reused: each club being
            // matched is scored against all of them, so without this the
            // league would cost twenty times as many requests.
            const rosters = new Map<string, Set<string>>();
            // The roster rows themselves, kept beside the surname sets:
            // the same fetch that proves which club is which club also
            // holds every footballer in it, so the player map below costs
            // no request of its own.
            const rosterRows = new Map<string, { id: string; name: string }[]>();
            for (const team of espnTeams) {
              const data = await espn(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league.espn}/teams/${team.id}/roster`) as
                { athletes?: unknown } | null;
              const raw = data?.athletes;
              const list = Array.isArray(raw)
                ? ((raw[0] as { items?: unknown[] } | undefined)?.items
                    ? (raw as { items?: unknown[] }[]).flatMap((g) => g.items ?? [])
                    : raw)
                : [];
              const rows = (list as { id?: string | number; lastName?: string; displayName?: string; fullName?: string }[])
                .map((p) => ({ id: String(p.id ?? ""), name: p.displayName || p.fullName || p.lastName || "" }))
                .filter((p) => p.id && p.name);
              rosterRows.set(team.id, rows);
              rosters.set(team.id, surnameSet(rows.map((p) => p.name)));
            }
            const candidates = espnTeams.map((t) => ({ id: t.id, name: t.name, squad: rosters.get(t.id) ?? new Set<string>() }));
            // A competition ESPN lists teams for but publishes no rosters
            // for cannot prove anything, and saying so once is the honest
            // report. The first full run instead printed a hundred and ten
            // Conference League clubs as "nothing proved", which reads as a
            // hundred and ten separate problems and hid the one real one.
            //
            // It is also not a gap worth closing here: a cup club belongs
            // to a domestic league, and it is that league's own run that
            // can map it. A club from a league this site does not cover has
            // no ESPN counterpart to be found in the first place.
            if (!candidates.some((c) => c.squad.size)) {
              console.log(`    espn publishes no rosters for this competition - ${afTeams.length} clubs skipped, not failed`);
              perLeague.push(`${league.code}: skipped, espn has no rosters for this competition (${afTeams.length} clubs)`);
              continue;
            }

            for (const club of afTeams) {
              const squadPayload = await af(`/players/squads?team=${club.id}`) as { response?: { players?: { id?: number; name?: string }[] }[] };
              const squad = (squadPayload.response?.[0]?.players ?? []).filter((p) => p.id && p.name) as { id: number; name: string }[];
              const ours = surnameSet(squad.map((p) => p.name));
              const verdict = chooseClub(ours, candidates);
              if (verdict) {
                map[String(club.id)] = verdict.id;
                proved.push(`${league.code}: ${club.name} (${club.id}) = ${verdict.name} (${verdict.id}), ${verdict.shared} shared, next best ${verdict.runnerUp}`);
                // And the footballers inside it.
                //
                // A name is weak evidence across a league and strong
                // evidence inside one squad: twenty-eight men, and
                // chooseAthlete still refuses the two who share a family
                // name. This is where the legacy /player/<number> URLs get
                // an answer that was not guessed - the alternative, which
                // shipped first, was matching a name against every
                // footballer in ten leagues at once.
                // And the managers, which are a different problem.
                //
                // There is no free source for a manager at all: ESPN's
                // roster names one and it is years out of date - it
                // answered Arsene Wenger for Arsenal, who left in 2018 -
                // so /coach/<n> simply stops existing when the paid plan
                // does. What can still be saved is where those URLs LAND.
                // A reader who follows an indexed manager page should
                // arrive at his club rather than at a 404, and the only
                // way to know which club is to ask now, while the paid
                // provider still answers. Every manager the club has had
                // is recorded, not only the current one: a page about a
                // former manager pointing at the club he managed is a
                // better answer than nothing.
                const coachPayload = await af(`/coachs?team=${club.id}`) as
                  { response?: { id?: number; career?: { team?: { id?: number }; end?: string | null }[] }[] };
                for (const person of coachPayload.response ?? []) {
                  if (typeof person.id !== "number") continue;
                  const open = (person.career ?? []).some((stint) => stint.team?.id === club.id && !stint.end);
                  // The current manager wins the row; a former one only
                  // takes it if nobody has claimed it.
                  if (open || !coaches[String(person.id)]) coaches[String(person.id)] = String(club.id);
                }

                const theirs = rosterRows.get(verdict.id) ?? [];
                for (const person of squad) {
                  const found = chooseAthlete(person.name, theirs.map((p) => ({ id: p.id, name: p.name })));
                  if (found) { players[String(person.id)] = found.id; playersProved += 1; } else { playersRefused += 1; }
                }
              } else {
                unmatched.push(`${league.code}: ${club.name} (${club.id}) - ${ours.size} surnames published, nothing proved`);
              }
            }
            const done = afTeams.filter((c) => map[String(c.id)]).length;
            perLeague.push(`${league.code}: ${done} of ${afTeams.length} proved`);
          }

          console.log(`\n=== proved (${proved.length})`);
          for (const line of proved) console.log(`  ${line}`);
          console.log(`\n=== unmatched (${unmatched.length}) - these need a hand, and are why this run is read`);
          for (const line of unmatched) console.log(`  ${line}`);

          if (!Object.keys(map).length) { console.log("\nnothing proved - not writing a file"); process.exit(0); }

          const path = "lib/team-map.ts";
          // An existing map is added to, never replaced: a club proved in
          // an earlier run keeps its row even when this run could not
          // reach its squad, and a row corrected by hand is not overwritten
          // by a machine.
          const existing: Record<string, string> = {};
          if (existsSync(path)) {
            for (const m of readFileSync(path, "utf8").matchAll(/(\d+)\s*:\s*"(\d+)"/g)) existing[m[1]] = m[2];
          }
          const merged = { ...map, ...existing };
          const rows = Object.entries(merged)
            .sort((a, b) => Number(a[0]) - Number(b[0]))
            .map(([af, es]) => `  ${af}: "${es}",`)
            .join("\n");
          writeFileSync(path, [
            "// Generated by .github/workflows/club-map.yml. Rows are added, never",
            "// replaced - a row corrected by hand stays corrected.",
            "//",
            "// The left number is API-Football's club id, which is what /team/<n> on",
            "// this site runs on and what Google has indexed. The right one is ESPN's,",
            "// which is where the squad, the roster and the crest come from once the",
            "// paid plan ends on 23 September.",
            "//",
            "// Every row here was proved, not guessed: the two clubs' published squads",
            "// share at least four surnames and no other club in the league shares as",
            "// many. A club that could not show that is absent from this file, and its",
            "// page keeps whatever lib/entity-cache.ts already holds rather than being",
            "// pointed at somebody else. The rule is lib/club-match.ts.",
            "export const ESPN_TEAM_BY_API_FOOTBALL: Record<number, string> = {",
            rows,
            "};",
            "",
            "export function espnTeamFor(apiFootballId: number | null | undefined): string | null {",
            "  if (typeof apiFootballId !== \"number\") return null;",
            "  return ESPN_TEAM_BY_API_FOOTBALL[apiFootballId] ?? null;",
            "}",
            "",
          ].join("\n"));
          console.log(`\nwrote aisport-am/${path}: ${Object.keys(merged).length} rows (${Object.keys(map).length} proved this run)`);

          // The footballers, on the same rules and from the same fetches.
          const playerPath = "lib/player-map.ts";
          const existingPlayers: Record<string, string> = {};
          if (existsSync(playerPath)) {
            for (const m of readFileSync(playerPath, "utf8").matchAll(/(\d+)\s*:\s*"(\d+)"/g)) existingPlayers[m[1]] = m[2];
          }
          const mergedPlayers = { ...players, ...existingPlayers };
          const playerRows = Object.entries(mergedPlayers)
            .sort((a, b) => Number(a[0]) - Number(b[0]))
            .map(([af, es]) => `  ${af}: "${es}",`)
            .join("\n");
          writeFileSync(playerPath, [
            "// Generated by .github/workflows/club-map.yml. Rows are added, never",
            "// replaced - a row corrected by hand stays corrected.",
            "//",
            "// The left number is API-Football's player id, which is what /player/<n>",
            "// on this site runs on and what Google has indexed. The right one is",
            "// ESPN's athlete id.",
            "//",
            "// Matched INSIDE one squad, never across a league. A family name is weak",
            "// evidence among ten leagues of footballers and strong evidence among",
            "// twenty-eight team-mates, and chooseAthlete still refuses the two who",
            "// share one. A footballer who could not be told apart from a team-mate is",
            "// absent, and his page renders exactly as it did before.",
            "export const ESPN_ATHLETE_BY_API_FOOTBALL: Record<number, string> = {",
            playerRows,
            "};",
            "",
            "export function espnAthleteFor(apiFootballId: number | null | undefined): string | null {",
            "  if (typeof apiFootballId !== \"number\") return null;",
            "  return ESPN_ATHLETE_BY_API_FOOTBALL[apiFootballId] ?? null;",
            "}",
            "",
          ].join("\n"));
          const coachPath = "lib/coach-map.ts";
          const existingCoaches: Record<string, string> = {};
          if (existsSync(coachPath)) {
            for (const m of readFileSync(coachPath, "utf8").matchAll(/(\d+)\s*:\s*(\d+)/g)) existingCoaches[m[1]] = m[2];
          }
          const mergedCoaches = { ...coaches, ...existingCoaches };
          const coachRows = Object.entries(mergedCoaches)
            .sort((a, b) => Number(a[0]) - Number(b[0]))
            .map(([coach, team]) => `  ${coach}: ${team},`)
            .join("\n");
          writeFileSync(coachPath, [
            "// Generated by .github/workflows/club-map.yml. Rows are added, never",
            "// replaced - a row corrected by hand stays corrected.",
            "//",
            "// A manager's API-Football id, and the club he managed. Not a data",
            "// source: it is a forwarding address.",
            "//",
            "// There is no free source for a manager anywhere. ESPN's roster names",
            "// one and it is years out of date - it answered Arsene Wenger for",
            "// Arsenal, who left in 2018 - so /coach/<n> stops existing when the",
            "// paid plan does, on 23 September. What this saves is where those",
            "// URLs land: the reader arrives at the club rather than at a 404.",
            "//",
            "// It could only be built while both the manager and his club were",
            "// still visible in the same answer, which is to say before that date.",
            "export const TEAM_BY_COACH: Record<number, number> = {",
            coachRows,
            "};",
            "",
            "export function clubOfCoach(coachId: number | null | undefined): number | null {",
            "  if (typeof coachId !== \"number\") return null;",
            "  return TEAM_BY_COACH[coachId] ?? null;",
            "}",
            "",
          ].join("\n"));
          console.log(`wrote aisport-am/${coachPath}: ${Object.keys(mergedCoaches).length} managers (${Object.keys(coaches).length} this run)`);
          console.log(`wrote aisport-am/${playerPath}: ${Object.keys(mergedPlayers).length} rows (${playersProved} proved this run, ${playersRefused} refused as ambiguous)`);
          // The unmatched list is the part of this job a person has to
          // read, and in the first full run it was buried under six
          // hundred lines of test output. It is written out so the last
          // step can print it where it will be seen.
          writeFileSync("map-report.txt", [
            `${Object.keys(merged).length} clubs in the map, ${Object.keys(map).length} proved this run`,
            `${Object.keys(mergedPlayers).length} footballers in the map, ${playersProved} proved this run, ${playersRefused} refused as ambiguous`,
            `${Object.keys(mergedCoaches).length} managers with a forwarding address`,
            ...perLeague.map((line) => `  ${line}`),
            `${unmatched.length} clubs could not prove themselves:`,
            ...unmatched.map((line) => `  ${line}`),
          ].join("\n"));
          TS
          npx tsx map.mts
          rm -f map.mts

      - name: Typecheck and test what was written
        run: |
          if [ ! -f lib/team-map.ts ]; then echo "no map written"; exit 0; fi
          npm run typecheck
          npm run test:units

      - name: Commit it and ask for a read
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain aisport-am/lib/team-map.ts aisport-am/lib/player-map.ts aisport-am/lib/coach-map.ts)" ]; then echo "nothing to commit"; exit 0; fi
          TARGET="claude/club-map"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The commit has to sit ON TOP of the branch, not on top of main.
          # The first full run committed onto main and pushed at a branch
          # that already had a commit of its own, and git refused it as a
          # non-fast-forward - two hundred clubs proved and thrown away
          # because of where the commit was standing. The file is carried
          # across by hand; nothing else in the tree needs to be.
          git fetch origin "$TARGET" 2>/dev/null || true
          if git rev-parse --verify --quiet "refs/remotes/origin/$TARGET" >/dev/null; then
            # Out of the way BEFORE the checkout, not just copied aside.
            # The file is untracked on main and tracked on the branch, and
            # git refuses to check out over an untracked file it would
            # overwrite - which is how the second full run died with two
            # hundred proved clubs in the working tree.
            cp aisport-am/lib/team-map.ts "$RUNNER_TEMP/team-map.ts"
            cp aisport-am/lib/player-map.ts "$RUNNER_TEMP/player-map.ts"
            cp aisport-am/lib/coach-map.ts "$RUNNER_TEMP/coach-map.ts"
            rm -f aisport-am/lib/team-map.ts aisport-am/lib/player-map.ts aisport-am/lib/coach-map.ts aisport-am/lib/coach-map.ts
            git checkout -q -B "$TARGET" "origin/$TARGET"
            cp "$RUNNER_TEMP/team-map.ts" aisport-am/lib/team-map.ts
            cp "$RUNNER_TEMP/player-map.ts" aisport-am/lib/player-map.ts
            cp "$RUNNER_TEMP/coach-map.ts" aisport-am/lib/coach-map.ts
            if [ -z "$(git status --porcelain aisport-am/lib/team-map.ts aisport-am/lib/player-map.ts aisport-am/lib/coach-map.ts)" ]; then echo "the branch already has these rows"; exit 0; fi
          fi
          git add aisport-am/lib/team-map.ts aisport-am/lib/player-map.ts aisport-am/lib/coach-map.ts aisport-am/lib/coach-map.ts
          git commit -m "Map the two providers' club and player numbers to each other

          Every row was proved by squad overlap rather than by name: the
          two clubs' published squads share at least four surnames and no
          other club in the league shares as many. A club that could not
          show that is absent, and its page keeps what the entity cache
          already holds instead of being pointed at a different club."
          git push origin HEAD:"$TARGET"
          # The pull request, and the truth about whether it was opened.
          #
          # This used to send the request with its output on /dev/null and
          # then print "opened a pull request" whatever came back. It never
          # opened one: a workflow's GITHUB_TOKEN cannot create a pull
          # request unless "Allow GitHub Actions to create and approve pull
          # requests" is turned on for the repository, and it is not. Three
          # runs reported success at the one step that had done nothing,
          # which is worse than failing.
          open=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:$TARGET&state=open" \
            | grep -c '"number"' || true)
          if [ "$open" != "0" ]; then echo "a pull request on $TARGET is already open"; exit 0; fi
          code=$(curl -sS -o /tmp/pr.json -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{\"title\":\"Map the two providers' club numbers to each other\",\"head\":\"$TARGET\",\"base\":\"main\",\"body\":\"Built while both providers still answer, which is the only time it can be built: the paid plan ends on 23 September and after that there is nothing to compare against.\\n\\nEvery row was proved by squad overlap, not by name. The two clubs' published squads share at least four surnames and no other club in the league shares as many; two different clubs do not share four players. The rule is in lib/club-match.ts and is unit-tested. A club that could not prove itself is absent from the file and is named in the run log, to be resolved by hand.\\n\\nThis file changes nothing on its own - nothing reads it yet.\"}")
          if [ "$code" = "201" ]; then
            echo "opened a pull request on $TARGET"
          else
            echo "could NOT open a pull request (http $code). The rows are pushed and safe on $TARGET:"
            head -c 400 /tmp/pr.json; echo
            echo "open it by hand: https://github.com/${{ github.repository }}/compare/main...$TARGET?expand=1"
          fi

      # Last, so it is the part of the log that is actually read.
      - name: Say which clubs still need a hand
        if: always()
        run: cat map-report.txt 2>/dev/null || echo "no report written"
