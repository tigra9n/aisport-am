# What can the Armenian league be built from, for nothing?
#
# MEASURED on 6 September, from api-sports' own support and its pricing
# page: the free plan serves "only seasons between Y-4 and Y-2" - for
# 2026 that is 2022 to 2024 - and the restriction applies to every
# endpoint. So when the Pro subscription ends on 23 September, six
# things go with it: the Armenian squads, the Armenian player pages, the
# live minute, the Armenian scoring chart, the Armenian match centre and
# the weekly photograph refresh. The cheapest paid plan is $19 a month,
# $228 a year, and the owner wants the site to cost nothing.
#
# Highlightly is the only free candidate left. Two rounds have been run:
#
#   round 1 (6 Sep) - /standings works, /matches?leagueId=&date= works
#     and carries state.clock and state.score, /teams and /players
#     answered 400 "property X should not exist" (so they exist, asked
#     wrongly), /squads, /teams/{id}/squad, /top-scorers, /statistics
#     answered 404.
#   round 2 (6 Sep) - /teams?name=, /teams/{id}, /players?name= all 200
#     but carry nothing beyond id, name, logo. /matches/{id},
#     /lineups/{id}, /events/{id}, /statistics/{id} all 200 - the
#     endpoints are real - but every array in them was empty, because
#     the probe ran eleven minutes BEFORE kick-off. Then the day's
#     hundred requests ran out mid-run.
#
# So the one question that decides the 23 September cutover is still
# open: does Highlightly fill lineups, events and statistics once a
# match has actually been played? This round asks exactly that, on a
# FINISHED match, and nothing else - eight requests, not thirty.
name: Armenia for free

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Match day (YYYY-MM-DD), or a match id when mode is 'one'. Empty = yesterday."
        required: false
        default: ""
      mode:
        description: "provider | site | sources | lineups | next | one | seo | urls | mirror | squad"
        required: false
        default: "provider"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Which source actually served the board, read from the deployed
      # site rather than guessed. The Armenian rows carry the provider in
      # their own link: "hl-" is Highlightly, "sdb-" is the TheSportsDB
      # fallback, "af-" is the paid provider that is going away. This runs
      # from a runner because the site refuses this agent's addresses.
      - name: What the deployed board is serving
        if: ${{ inputs.mode == 'site' }}
        run: |
          board=$(curl -sS --max-time 45 "https://aifootball.am/live?_c=$(date +%s)")
          echo "bytes: ${#board}"
          echo "highlightly rows: $(grep -o 'hl-[0-9]*' <<<"$board" | sort -u | tr '\n' ' ')"
          echo "sportsdb rows:    $(grep -o 'sdb-[0-9]*' <<<"$board" | sort -u | tr '\n' ' ')"
          echo "apifootball rows: $(grep -o 'af-[0-9]*' <<<"$board" | sort -u | tr '\n' ' ')"
          echo "--- every line mentioning an Armenian club or a minute:"
          grep -o '[^<>]\{0,60\}\(Շիրակ\|Սարդարապատ\|Ընդմիջում\|Ավարտված\|[0-9]\{1,3\}′\)[^<>]\{0,60\}' <<<"$board" | sort -u | head -20
          # And what the fallback itself can see, asked directly. An empty
          # Armenian board has two possible causes - Highlightly refused,
          # or TheSportsDB does not carry the match - and only this
          # separates them. Its free league lists are "next" and "past",
          # so a match being played right now can be in neither, which is
          # the weakness the move to Highlightly was meant to end.
          echo "--- what TheSportsDB has for the Armenian league today ($(date -u +%F)):"
          for list in eventsnextleague eventspastleague; do
            curl -sS --max-time 30 "https://www.thesportsdb.com/api/v1/json/3/$list.php?id=4619"               | grep -o '"dateEvent":"[^"]*","[^"]*":"[^"]*"\|"strEvent":"[^"]*"\|"dateEvent":"[^"]*"'               | paste - - 2>/dev/null | grep "$(date -u +%F)" || echo "  $list: nothing today"
          done

          # The legacy footballer URLs, which are the ones Google holds
          # and the only ones the new redirect touches - every link on the
          # site itself already carries an "espn-" key. What is being
          # measured is not which page appears but that the new path does
          # not throw: 200 or 301 is fine, 500 is the change breaking a
          # page that used to work.
          # Does ESPN publish anything of a manager beyond his name?
          #
          # The club page now prints the name from the roster response and
          # nothing else, because nothing else was read. Before inventing a
          # headshot URL and hoping, this asks: the whole coach object as
          # ESPN sends it, and then the two addresses a photograph would
          # plausibly live at. A 200 means there is a face to show; a 404
          # means the name is genuinely all there is.
          echo "--- what ESPN publishes about a manager:"
          roster=$(curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams/359/roster")
          echo "  coach object: $(grep -o '"coach":\[[^]]*\]' <<<"$roster" | head -c 300)"
          cid=$(grep -o '"coach":\[{"id":"[0-9]*' <<<"$roster" | grep -o '[0-9]*$' | head -1)
          echo "  coach id: ${cid:-none}"
          if [ -n "$cid" ]; then
            for u in "https://a.espncdn.com/i/headshots/soccer/players/full/$cid.png"                      "https://a.espncdn.com/i/headshots/soccer/coaches/full/$cid.png"; do
              echo "  $(curl -s -o /dev/null -w "%{http_code}" "$u" || true)  $u"
            done
          fi

          echo "--- legacy /player/<number>:"
          for pid in 306 1100 497488 154; do
            # One line, no process substitution: curl's -w output has no
            # trailing newline, so `read` returns non-zero at EOF and
            # `bash -e` killed the step before it printed anything.
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "https://aifootball.am/player/$pid" || true)
            echo "  player/$pid -> ${out:-no answer}"
          done

          first=$(grep -o 'hl-[0-9]*' <<<"$board" | head -1)
          if [ -n "$first" ]; then
            echo "--- the match page for $first:"
            page=$(curl -sS --max-time 45 "https://aifootball.am/live/match/$first?_c=$(date +%s)")
            echo "bytes: ${#page}"
            grep -o '[^<>]\{0,50\}\(Կազմ\|Իրադարձ\|Վիճակագր\|Մարզադաշտ\|Մրցավար\)[^<>]\{0,50\}' <<<"$page" | sort -u | head -10
          fi

      # Who else has the Armenian league, and how much of it?
      #
      # Highlightly has the table, the fixtures and the live minute and
      # nothing else - no squad endpoint in any spelling, no top scorers.
      # ESPN's 218 soccer leagues do not include Armenia at all. So the
      # squads, the scoring chart and the player pages have no free source
      # YET, and "yet" is the word this step exists to test.
      #
      # The first candidate is the one already in the repository. The
      # photograph workflow pulls Armenian faces from TheSportsDB and has
      # filled three and a half thousand of them, which means that provider
      # knows Armenian squads by name. It has never been asked for the rest
      # of the row - position, shirt number, birth date - and if it has
      # them, the Armenian squad page comes back for nothing.
      - name: Who else has the Armenian league
        if: ${{ inputs.mode == 'sources' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          echo "=== TheSportsDB, which already gives this site Armenian faces"
          for club in Alashkert Pyunik Urartu Noah; do
            team=$(curl -sS --max-time 30 "https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=$club" || true)
            tid=$(grep -o '"idTeam":"[0-9]*"' <<<"$team" | head -1 | grep -o '[0-9]*' || true)
            echo "--- $club (idTeam ${tid:-none}, country $(grep -o '"strCountry":"[^"]*"' <<<"$team" | head -1))"
            [ -z "$tid" ] && continue
            squad=$(curl -sS --max-time 30 "https://www.thesportsdb.com/api/v1/json/3/lookup_all_players.php?id=$tid" || true)
            echo "    players named: $(grep -o '"strPlayer":' <<<"$squad" | wc -l)"
            echo "    fields on the first row:"
            head -c 1200 <<<"$squad" | tr ',' '\n' | grep -E '"(strPlayer|strPosition|strNumber|dateBorn|strNationality|strCutout|strThumb|strTeam)"' | head -10 | sed 's/^/      /'
          done

          echo
          echo "=== Bzzoiro (BSD), which advertises all of this for nothing"
          # A service offering what API-Football and Sportmonks charge for,
          # free and without a rate limit, is either very generous or very
          # short-lived. Neither matters if it does not have the league:
          # its own material names thirty-four, and every one of them
          # named is a big one. So the only question asked here is whether
          # Armenia is in its list at all.
          # The coverage page itself, which is the one that answers this.
          # Guessing endpoint paths got 301s and 404s; the page a human
          # would read is right there and needs no key.
          cov=$(curl -sSL --max-time 30 "https://sports.bzzoiro.com/football-coverage/" || true)
          echo "--- coverage page: ${#cov} bytes, armenia mentioned $(grep -o -i -c armenia <<<"$cov" || true) times"
          grep -o -i '[^<>]\{0,80\}armenia[^<>]\{0,80\}' <<<"$cov" | head -5 | sed 's/^/    /'
          echo "--- the leagues it does name:"
          grep -o -i '[A-ZÀ-Ý][A-Za-zÀ-ÿ. ]\{3,30\}\(League\|Liga\|Serie\|Bundesliga\|Ligue\|Premier\|Eredivisie\|Championship\|Cup\)' <<<"$cov" \
            | sed 's/^ *//' | sort -u | head -45 | sed 's/^/    /'

          for path in /api/leagues /api/v1/leagues /leagues /api/competitions; do
            body=$(curl -sS --max-time 25 "https://sports.bzzoiro.com$path" || true)
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "https://sports.bzzoiro.com$path" || true)
            echo "--- $path -> http $code, ${#body} bytes"
            [ "${#body}" -lt 40 ] && continue
            echo "    armenia mentioned: $(grep -o -i -c armenia <<<"$body" || true)"
            echo "    first 300: $(head -c 300 <<<"$body" | tr '\n' ' ')"
          done

          echo
          echo "=== football-data.org, whose token this site already holds"
          comps=$(curl -sS --max-time 30 -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" "https://api.football-data.org/v4/competitions" || true)
          echo "    competitions on this plan: $(grep -o '"code":' <<<"$comps" | wc -l)"
          echo "    the plan's list: $(grep -o '"code":"[A-Z0-9]*"' <<<"$comps" | tr '\n' ' ')"
          echo "    anything Armenian: $(grep -c -i armenia <<<"$comps" || true)"

      # The one question the round-three run left unread.
      #
      # That run measured everything else on a finished match - eight
      # events with a playerId each, eight statistics a side, a full
      # player profile - but its /lineups answer scrolled past unread,
      # and it is the line that decides whether the Armenian SQUADS come
      # back. Events name only the men who did something; a lineup names
      # eleven and the bench. This asks that alone, in one request, and
      # prints it whole.
      # Is the empty lineup this match's, this league's, or the plan's?
      #
      # MEASURED on 7 September: /lineups/1345873453 - Shirak 1:0
      # Sardarapat, a match that had certainly been played, because its
      # /events answer named eight things that happened in it - came back
      # 283 bytes with formation "Unknown" and both initialLineup arrays
      # empty. One match is not a finding. Three questions separate the
      # three explanations, and only the third one closes the squads:
      #
      #   1. other finished Armenian matches - is it every Armenian match?
      #   2. a finished match in a league everyone covers - does Highlightly
      #      ever fill a lineup on the free plan, for anybody?
      #   3. the match object itself - does /matches/{id} carry the names
      #      that /lineups/{id} does not?
      #
      # If the big league's lineup is full and Armenia's is empty, the
      # answer is coverage and no amount of asking will change it. If both
      # are empty, it is the free plan, and the paid tier would be worth
      # pricing.
      - name: Does a played match have its lineups?
        if: ${{ inputs.mode == 'lineups' }}
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          hl() { curl -sS --max-time 25 -H "x-rapidapi-key: $HIGHLIGHTLY_KEY" -H "Accept: application/json" "https://sports.highlightly.net/football$1" || true; }
          rows() { jq -c '(.data // .)[]?' 2>/dev/null; }
          # A lineup answer read the same way every time it is printed, so
          # "empty" always means the same thing: how many men each side named.
          verdict() {
            local body="$1"
            echo "      bytes ${#body}  home named $(jq -r '(.homeTeam.initialLineup // [])|length' <<<"$body" 2>/dev/null)  away named $(jq -r '(.awayTeam.initialLineup // [])|length' <<<"$body" 2>/dev/null)  formation $(jq -r '.homeTeam.formation // "-"' <<<"$body" 2>/dev/null)"
          }

          echo "=== 1. finished Armenian matches, walking back from yesterday"
          ids=""
          for d in $(seq 1 14); do
            day=$(date -u -d "-$d day" +%F)
            body=$(hl "/matches?leagueId=291826&date=$day")
            got=$(rows <<<"$body" | jq -r 'select((.state.description // "") | test("fin|ended|ft";"i")) | "\(.id)\t\(.homeTeam.name) - \(.awayTeam.name)"' 2>/dev/null)
            [ -z "$got" ] && continue
            echo "  $day"
            echo "$got" | sed 's/^/    /'
            ids="$ids $(awk -F'\t' '{print $1}' <<<"$got" | tr '\n' ' ')"
            [ "$(wc -w <<<"$ids")" -ge 3 ] && break
          done
          echo "  --- their lineups:"
          for id in $(tr ' ' '\n' <<<"$ids" | grep -v '^$' | head -3); do
            echo "    match $id"
            verdict "$(hl "/lineups/$id")"
          done

          echo
          echo "=== 2. the same question in a league nobody neglects"
          big=$(hl "/leagues?leagueName=Premier%20League&limit=5")
          echo "  leagues answered: $(head -c 400 <<<"$big")"
          bigid=$(rows <<<"$big" | jq -r 'select((.country.name // .country.code // "") | test("Eng";"i")) | .id' 2>/dev/null | head -1)
          [ -z "$bigid" ] && bigid=$(rows <<<"$big" | jq -r '.id' 2>/dev/null | head -1)
          echo "  using league $bigid"
          for d in $(seq 1 10); do
            day=$(date -u -d "-$d day" +%F)
            body=$(hl "/matches?leagueId=$bigid&date=$day")
            got=$(rows <<<"$body" | jq -r 'select((.state.description // "") | test("fin|ended|ft";"i")) | "\(.id)\t\(.homeTeam.name) - \(.awayTeam.name)"' 2>/dev/null | head -1)
            [ -z "$got" ] && continue
            echo "  $day  $got"
            bigmatch=$(cut -f1 <<<"$got")
            break
          done
          if [ -n "${bigmatch:-}" ]; then
            echo "  --- its lineup:"
            answer=$(hl "/lineups/$bigmatch")
            verdict "$answer"
            echo "  --- first 600 characters, so the shape is visible when it is full:"
            head -c 600 <<<"$answer"; echo
          else
            echo "  no finished match found in that league in ten days"
          fi

          echo
          echo "=== 3. does the match object itself carry the names?"
          first=$(tr ' ' '\n' <<<"$ids" | grep -v '^$' | head -1)
          if [ -n "$first" ]; then
            m=$(hl "/matches/$first")
            echo "  bytes ${#m}"
            echo "  keys: $(jq -r '[paths(scalars==null or true)|map(tostring)|join(".")]|map(split(".")[0])|unique|join(", ")' <<<"$m" 2>/dev/null | head -c 300)"
            echo "  any lineup-shaped field: $(grep -o '\"\(lineup\|lineups\|initialLineup\|players\|squad\|substitutes\)\"' <<<"$m" | sort -u | tr '\n' ' ')"
          fi

      # Does the lineup exist only while the match is being played?
      #
      # The finished-match answer was empty three times over, and the same
      # question in the Premier League came back with a formation and a
      # named bench - so the free plan does serve lineups, and it does not
      # wipe them when the whistle goes. That is already most of an answer.
      # But "most" is not "measured": nobody has asked Highlightly for an
      # Armenian lineup while an Armenian match was actually on the pitch.
      # Round two came closest and missed by eleven minutes.
      #
      # So: mode 'next' prints the coming Armenian fixtures with their
      # kick-off times, and mode 'one' asks everything about a single match
      # id given in the date box. Run 'one' in the second half and the
      # question is closed either way.
      # What Google is actually complaining about.
      #
      # Search Console mailed twice on 7 September: pages not indexed as
      # "duplicate without a user-selected canonical", "not found (404)",
      # "excluded by noindex", "server error (5xx)", "page with redirect"
      # and "blocked by robots.txt". Four of those six are this site doing
      # what it was told to - the old domain redirects, /control is
      # disallowed, /search and /moderate are noindex - and two are not:
      # a 404 or a 500 on a URL Google was told to crawl is a page the
      # site is losing.
      #
      # Every page file carries alternates.canonical, so "no canonical"
      # can only be the rendered HTML disagreeing with the source. That
      # is exactly what a runner can check and this agent cannot: the
      # site refuses this agent's addresses.
      #
      # So: read the sitemap the site is publishing right now, open a
      # sample of every kind of URL in it, and print status, canonical
      # and robots meta for each.
      - name: What Google sees
        if: ${{ inputs.mode == 'seo' }}
        run: |
          base="https://aifootball.am"
          echo "=== robots.txt"
          curl -sS --max-time 30 "$base/robots.txt"
          echo
          echo "=== sitemap.xml"
          sm=$(curl -sS --max-time 60 "$base/sitemap.xml")
          echo "  bytes ${#sm}  urls: $(grep -c '<loc>' <<<"$sm" || true)"
          echo "  by kind:"
          grep -o '<loc>[^<]*</loc>' <<<"$sm" | sed 's/<[^>]*>//g' \
            | sed "s|$base/||" | awk -F/ '{print ($1==""?"(home)":$1)}' | sort | uniq -c | sort -rn
          echo
          echo "=== news-sitemap.xml"
          ns=$(curl -sS --max-time 45 "$base/news-sitemap.xml")
          echo "  bytes ${#ns}  urls: $(grep -c '<loc>' <<<"$ns" || true)"
          echo
          # One of each kind, plus a spread of articles, opened for real.
          echo "=== opening a sample: status | canonical | robots | title"
          urls=$( { printf '%s\n' "$base/" "$base/live" "$base/standings" "$base/armenia" \
                      "$base/topscorers" "$base/opinions" "$base/about" "$base/search" \
                      "$base/team/582" "$base/player/306" "$base/news/does-not-exist-xyz"
                    grep -o '<loc>[^<]*</loc>' <<<"$sm" | sed 's/<[^>]*>//g' | grep '/news/' | head -12
                    grep -o '<loc>[^<]*</loc>' <<<"$sm" | sed 's/<[^>]*>//g' | grep -E '/(category|league|opinions)/' | head -8
                  } )
          bad=0
          while read -r u; do
            [ -z "$u" ] && continue
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 45 "$u" || echo "---")
            can=$(grep -o '<link[^>]*rel="canonical"[^>]*>' /tmp/body | grep -o 'href="[^"]*"' | head -1 | cut -d'"' -f2)
            rob=$(grep -o '<meta[^>]*name="robots"[^>]*>' /tmp/body | grep -o 'content="[^"]*"' | head -1 | cut -d'"' -f2)
            ttl=$(grep -o '<title>[^<]*</title>' /tmp/body | sed 's/<[^>]*>//g' | head -1)
            mark=" "
            case "$code" in 5*) mark="!"; bad=$((bad+1));; 404) mark="?";; esac
            printf '%s %s  %-58s  canonical=%s  robots=%s  %s\n' "$mark" "$code" "${u#https://aifootball.am}" "${can:-NONE}" "${rob:--}" "${ttl:0:40}"
          done <<<"$urls"
          echo
          echo "5xx seen: $bad"

      # Which address on a marketplace is the real one.
      #
      # The API-Football listing on RapidAPI was linked from memory on
      # 7 September and answered "API not found" in the owner's browser,
      # while a web search still returns the same address as live. Neither
      # this agent's machine nor its search tool can open rapidapi.com -
      # the egress proxy blocks it - so the only way to know which URL
      # actually resolves is to have a runner open each candidate and
      # report the status line. Guessing a second time would waste the
      # owner's morning, not mine.
      - name: Which marketplace address resolves
        if: ${{ inputs.mode == 'urls' }}
        run: |
          for u in "https://rapidapi.com/api-sports/api/api-football" \
                   "https://rapidapi.com/api-sports/api/api-football/pricing" \
                   "https://rapidapi.com/api-sports/api/api-football-beta/pricing" \
                   "https://rapidapi.com/api-sports/api/api-football-v1/pricing" \
                   "https://rapidapi.com/search/api-football" \
                   "https://api-sports.io/documentation/football/v3" \
                   "https://dashboard.api-football.com/register"; do
            out=$(curl -sSL --max-time 30 -w '\n%{http_code} %{url_effective}' "$u" 2>/dev/null || echo "no answer")
            code=$(tail -1 <<<"$out")
            ttl=$(grep -o '<title>[^<]*</title>' <<<"$out" | sed 's/<[^>]*>//g' | head -1)
            printf '%s\n    title: %s\n' "$code" "${ttl:0:90}"
      # A marketplace mirror, asked on a budget of fifty a month.
      #
      # The owner subscribed to SportAPI (rapidsportapi/sportapi7) on
      # 7 September: free plan, 50 requests a MONTH, hard limit. That is
      # nothing for serving a site - one day of live scores costs more -
      # but it is the right size for the one thing still missing, which is
      # the twelve Armenian squads, twelve requests, once.
      #
      # Its own description ("20+ sports, 5000+ leagues and tournaments")
      # is Sofascore's, so it is an unofficial mirror of Sofascore and its
      # paths are most likely Sofascore's too. No endpoint list is
      # published anywhere a search can reach, and RapidAPI's pages cannot
      # be opened by this agent at all, so the paths below are guesses -
      # which is exactly why this counts.
      #
      # Every answer prints RapidAPI's x-ratelimit headers, so the real
      # cost is measured rather than assumed: if a wrong path is refused
      # by the gateway without touching the quota, the remaining count
      # will not move, and guessing is then free. The loop stops at the
      # first success or after six attempts, whichever comes first.
      - name: What the fifty-a-month mirror answers
        if: ${{ inputs.mode == 'mirror' }}
        env:
          SPORTAPI7_KEY: ${{ secrets.SPORTAPI7_KEY }}
        run: |
          host="sportapi7.p.rapidapi.com"
          try() {
            echo "--- $1"
            out=$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' --max-time 25 \
              -H "x-rapidapi-key: $SPORTAPI7_KEY" -H "x-rapidapi-host: $host" \
              "https://$host$1" || echo "000")
            echo "    http $out"
            grep -i '^x-ratelimit' /tmp/h | sed 's/^/    /' || echo "    (no quota header)"
            echo "    body: $(head -c 400 /tmp/b)"
            [ "$out" = "200" ]
          }
          for path in "/api/v1/search/all?q=Shirak" \
                      "/api/v1/search/Shirak" \
                      "/api/v1/search/all/Shirak" \
                      "/api/v1/team/search/Shirak"; do
            if try "$path"; then echo "*** this path works: $path"; break; fi
          done

      # The squad itself, one team, one request.
      #
      # MEASURED on 7 September: /api/v1/search/all?q=Shirak answered on
      # the first guess with Sofascore's own shape - "FC Shirak Gyumri",
      # id 33817, country AM - and the quota header moved 50 to 49, so
      # the paths are Sofascore's and each one costs exactly one. That
      # leaves the question this account was opened for: does the mirror
      # carry the players, with numbers and positions, for an Armenian
      # club that no free provider has been able to name.
      #
      # The team id goes in the date box. One request per run, and the
      # remaining count is printed after it, because 50 a month is the
      # whole budget and there is no second key.
      - name: One Armenian squad from the mirror
        if: ${{ inputs.mode == 'squad' }}
        env:
          SPORTAPI7_KEY: ${{ secrets.SPORTAPI7_KEY }}
          TEAM: ${{ inputs.date }}
        run: |
          host="sportapi7.p.rapidapi.com"
          id="${TEAM:-33817}"
          curl -sS -D /tmp/h -o /tmp/b --max-time 25 \
            -H "x-rapidapi-key: $SPORTAPI7_KEY" -H "x-rapidapi-host: $host" \
            "https://$host/api/v1/team/$id/players"
          echo "http $(head -1 /tmp/h)"
          grep -i '^x-ratelimit-requests' /tmp/h | sed 's/^/  /'
          echo "  bytes $(wc -c < /tmp/b)"
          echo "  players named: $(jq -r '(.players // [])|length' /tmp/b 2>/dev/null)"
          echo "  --- every one of them:"
          jq -r '(.players // [])[] | "    \(.player.jerseyNumber // "-")  \(.player.name)  \(.player.position // "-")  \(.player.country.name // "-")"' /tmp/b 2>/dev/null | head -40
          echo "  --- one player whole, so the fields are visible:"
          jq -c '(.players // [])[0]' /tmp/b 2>/dev/null | head -c 900

      - name: When is the next Armenian match?
        if: ${{ inputs.mode == 'next' }}
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          hl() { curl -sS --max-time 25 -H "x-rapidapi-key: $HIGHLIGHTLY_KEY" -H "Accept: application/json" "https://sports.highlightly.net/football$1" || true; }
          echo "now: $(date -u +'%F %H:%MZ')  = Yerevan $(TZ=Asia/Yerevan date +'%F %H:%M')"
          for d in $(seq 0 6); do
            day=$(date -u -d "+$d day" +%F)
            hl "/matches?leagueId=291826&date=$day" \
              | jq -r --arg day "$day" '(.data // .)[]? | "  \($day)  \(.id)  \(.date)  \(.homeTeam.name) - \(.awayTeam.name)  [\(.state.description // "-")]"' 2>/dev/null
          done

      - name: Ask everything about one match
        if: ${{ inputs.mode == 'one' }}
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          MATCH: ${{ inputs.date }}
        run: |
          hl() { curl -sS --max-time 25 -H "x-rapidapi-key: $HIGHLIGHTLY_KEY" -H "Accept: application/json" "https://sports.highlightly.net/football$1" || true; }
          id="$MATCH"
          echo "asked at $(date -u +'%F %H:%M:%SZ') about match $id"
          m=$(hl "/matches/$id")
          echo "  state: $(jq -c '[(.data//[.])[]?|.state] | .[0]' <<<"$m" 2>/dev/null || head -c 200 <<<"$m")"
          l=$(hl "/lineups/$id")
          echo "  lineups: bytes ${#l}  home named $(jq -r '(.homeTeam.initialLineup // [])|length' <<<"$l" 2>/dev/null)  away named $(jq -r '(.awayTeam.initialLineup // [])|length' <<<"$l" 2>/dev/null)  formation $(jq -r '.homeTeam.formation // "-"' <<<"$l" 2>/dev/null)"
          head -c 800 <<<"$l"; echo
          e=$(hl "/events/$id")
          echo "  events: $(jq -r '(.data // .)|length' <<<"$e" 2>/dev/null) rows"
          st=$(hl "/statistics/$id")
          echo "  statistics: bytes ${#st}"

      - name: Does Highlightly fill a finished Armenian match?
        # Named, not excluded. Every mode added since has had to be
        # remembered here, and on 7 September one was not: a 'next' run
        # worth seven requests fell through into this step, which spends
        # about thirty, and the day's allowance was gone by 06:45 UTC with
        # the live-lineup question still unasked. A default step that runs
        # unless told otherwise will always be one edit behind.
        if: ${{ inputs.mode == 'provider' || inputs.mode == '' }}
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          DAY: ${{ inputs.date }}
        run: |
          cat > probe.mjs <<'JS'
          const KEY = process.env.HIGHLIGHTLY_KEY || "";
          if (!KEY) { console.log("no HIGHLIGHTLY_KEY"); process.exit(1); }
          // x-rapidapi-key, not x-api-key: the other one answers 403
          // "Missing mandatory HTTP Headers", which cost a day in
          // September when it shipped that way.
          const H = { "x-rapidapi-key": KEY, Accept: "application/json" };
          const HOST = "https://sports.highlightly.net/football";
          const LEAGUE = "291826";
          const day = process.env.DAY || new Date(Date.now() - 864e5).toISOString().slice(0, 10);

          const get = async (path) => {
            const r = await fetch(`${HOST}${path}`, { headers: H, signal: AbortSignal.timeout(20000) });
            const text = await r.text();
            let json = null;
            try { json = JSON.parse(text); } catch { /* not json */ }
            return { status: r.status, json, text };
          };

          // Print the shape, and for the arrays that decide this, the
          // first row whole. Round two printed shapes only and could
          // not tell "empty because not started" from "empty always".
          const shape = (v, depth = 0) => {
            const pad = "    ".repeat(depth + 1);
            if (Array.isArray(v)) return v.length ? `[${v.length}] of\n${shape(v[0], depth)}` : "[] EMPTY";
            if (v && typeof v === "object") {
              if (depth >= 2) return "{...}";
              return "\n" + Object.entries(v).slice(0, 16).map(([k, val]) => `${pad}${k}: ${shape(val, depth + 1)}`).join("\n");
            }
            return JSON.stringify(v)?.slice(0, 70) ?? String(v);
          };

          const ask = async (label, path, whole) => {
            try {
              const { status, json, text } = await get(path);
              console.log(`\n=== ${label}\n    ${path}\n    http ${status}`);
              if (!json) { console.log(`    ${text.slice(0, 200)}`); return null; }
              const body = Array.isArray(json) ? json : (json.data ?? json.response ?? json);
              console.log(`    ${shape(body)}`);
              if (whole) console.log(`    FIRST ROW WHOLE: ${JSON.stringify(whole(body))?.slice(0, 1200)}`);
              return body;
            } catch (e) { console.log(`\n=== ${label}\n    ${path}\n    ${String(e).slice(0, 150)}`); return null; }
          };

          // 1. Find a match that has actually been played. Guessing an
          // id is what wasted round two.
          const fixtures = await ask(`the matches of ${day}`, `/matches?leagueId=${LEAGUE}&date=${day}`);
          const played = (Array.isArray(fixtures) ? fixtures : []).find((m) => {
            const d = String(m?.state?.description || "").toLowerCase();
            return d.includes("finish") || d.includes("ended") || d.includes("ft");
          });
          if (!played) {
            console.log(`\nno finished match on ${day}. states: ${(fixtures || []).map((m) => m?.state?.description).join(", ") || "none"}`);
            console.log("re-run with a date that has one.");
            process.exit(0);
          }
          const ID = played.id;
          console.log(`\nreading ${played.homeTeam?.name} - ${played.awayTeam?.name}, id ${ID}`);
          // state.score printed WHOLE. Round two cut it off at two levels
          // and left lib/highlightly.ts reading five plausible spellings
          // instead of the one real one.
          console.log(`    state whole: ${JSON.stringify(played.state)}`);

          // 2. The three that decide it.
          await ask("lineups", `/lineups/${ID}`, (b) => b?.homeTeam);
          await ask("events", `/events/${ID}`, (b) => (Array.isArray(b) ? b.slice(0, 4) : b));
          await ask("statistics", `/statistics/${ID}`, (b) => (Array.isArray(b) ? b[0] : b));
          await ask("the match itself", `/matches/${ID}`, (b) => (Array.isArray(b) ? b[0]?.events?.slice(0, 3) : null));

          // 3. What /players will actually accept.
          //
          // Highlightly has no squad endpoint - /teams/{id}/squad and
          // /squads both answer 404 - but /players is real: it answered
          // 400 "property teamId should not exist" to the first round and
          // 200 to ?name=. A provider that names the property it rejects
          // can be asked which ones it wants, so this asks. If any of
          // these opens a squad, the Armenian squad page comes back
          // without a new provider.
          for (const param of ["teamName", "clubId", "team", "squadId", "leagueId", "countryCode", "season"]) {
            await ask(`players by ${param}`, `/players?${param}=${param === "leagueId" ? LEAGUE : "Shirak"}`);
          }

          // 4. The three the daily limit cut off last time.
          await ask("the leagues of a country", `/leagues?countryCode=AM`);
          await ask("last five games", `/last-five-games?teamId=${played.homeTeam?.id}`);
          await ask("a real player by id", `/players/7014119`, (b) => b);
          JS
          node probe.mjs
          rm -f probe.mjs
