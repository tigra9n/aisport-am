# What can the Armenian league be built from, for nothing?
#
# MEASURED on 6 September, from api-sports' own support and its pricing
# page: the free plan serves "only seasons between Y-4 and Y-2" - for
# 2026 that is 2022 to 2024 - and the restriction applies to every
# endpoint. So when the Pro subscription ends on 23 September, six
# things go with it: the Armenian squads, the Armenian player pages, the
# live minute, the Armenian scoring chart, the Armenian match centre and
# the weekly photograph refresh. The cheapest paid plan is $19 a month,
# $228 a year, and the owner wants the site to cost nothing.
#
# Highlightly is the only free candidate left. Two rounds have been run:
#
#   round 1 (6 Sep) - /standings works, /matches?leagueId=&date= works
#     and carries state.clock and state.score, /teams and /players
#     answered 400 "property X should not exist" (so they exist, asked
#     wrongly), /squads, /teams/{id}/squad, /top-scorers, /statistics
#     answered 404.
#   round 2 (6 Sep) - /teams?name=, /teams/{id}, /players?name= all 200
#     but carry nothing beyond id, name, logo. /matches/{id},
#     /lineups/{id}, /events/{id}, /statistics/{id} all 200 - the
#     endpoints are real - but every array in them was empty, because
#     the probe ran eleven minutes BEFORE kick-off. Then the day's
#     hundred requests ran out mid-run.
#
# So the one question that decides the 23 September cutover is still
# open: does Highlightly fill lineups, events and statistics once a
# match has actually been played? This round asks exactly that, on a
# FINISHED match, and nothing else - eight requests, not thirty.
name: Armenia for free

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Match day to read (YYYY-MM-DD). Empty = yesterday."
        required: false
        default: ""
      mode:
        description: "provider = ask Highlightly. site = read the deployed board. sources = look for another free provider."
        required: false
        default: "provider"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Which source actually served the board, read from the deployed
      # site rather than guessed. The Armenian rows carry the provider in
      # their own link: "hl-" is Highlightly, "sdb-" is the TheSportsDB
      # fallback, "af-" is the paid provider that is going away. This runs
      # from a runner because the site refuses this agent's addresses.
      - name: What the deployed board is serving
        if: ${{ inputs.mode == 'site' }}
        run: |
          board=$(curl -sS --max-time 45 "https://aifootball.am/live?_c=$(date +%s)")
          echo "bytes: ${#board}"
          echo "highlightly rows: $(grep -o 'hl-[0-9]*' <<<"$board" | sort -u | tr '\n' ' ')"
          echo "sportsdb rows:    $(grep -o 'sdb-[0-9]*' <<<"$board" | sort -u | tr '\n' ' ')"
          echo "apifootball rows: $(grep -o 'af-[0-9]*' <<<"$board" | sort -u | tr '\n' ' ')"
          echo "--- every line mentioning an Armenian club or a minute:"
          grep -o '[^<>]\{0,60\}\(Շիրակ\|Սարդարապատ\|Ընդմիջում\|Ավարտված\|[0-9]\{1,3\}′\)[^<>]\{0,60\}' <<<"$board" | sort -u | head -20
          # And what the fallback itself can see, asked directly. An empty
          # Armenian board has two possible causes - Highlightly refused,
          # or TheSportsDB does not carry the match - and only this
          # separates them. Its free league lists are "next" and "past",
          # so a match being played right now can be in neither, which is
          # the weakness the move to Highlightly was meant to end.
          echo "--- what TheSportsDB has for the Armenian league today ($(date -u +%F)):"
          for list in eventsnextleague eventspastleague; do
            curl -sS --max-time 30 "https://www.thesportsdb.com/api/v1/json/3/$list.php?id=4619"               | grep -o '"dateEvent":"[^"]*","[^"]*":"[^"]*"\|"strEvent":"[^"]*"\|"dateEvent":"[^"]*"'               | paste - - 2>/dev/null | grep "$(date -u +%F)" || echo "  $list: nothing today"
          done

          # The legacy footballer URLs, which are the ones Google holds
          # and the only ones the new redirect touches - every link on the
          # site itself already carries an "espn-" key. What is being
          # measured is not which page appears but that the new path does
          # not throw: 200 or 301 is fine, 500 is the change breaking a
          # page that used to work.
          # Does ESPN publish anything of a manager beyond his name?
          #
          # The club page now prints the name from the roster response and
          # nothing else, because nothing else was read. Before inventing a
          # headshot URL and hoping, this asks: the whole coach object as
          # ESPN sends it, and then the two addresses a photograph would
          # plausibly live at. A 200 means there is a face to show; a 404
          # means the name is genuinely all there is.
          echo "--- what ESPN publishes about a manager:"
          roster=$(curl -sS --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams/359/roster")
          echo "  coach object: $(grep -o '"coach":\[[^]]*\]' <<<"$roster" | head -c 300)"
          cid=$(grep -o '"coach":\[{"id":"[0-9]*' <<<"$roster" | grep -o '[0-9]*$' | head -1)
          echo "  coach id: ${cid:-none}"
          if [ -n "$cid" ]; then
            for u in "https://a.espncdn.com/i/headshots/soccer/players/full/$cid.png"                      "https://a.espncdn.com/i/headshots/soccer/coaches/full/$cid.png"; do
              echo "  $(curl -s -o /dev/null -w "%{http_code}" "$u" || true)  $u"
            done
          fi

          echo "--- legacy /player/<number>:"
          for pid in 306 1100 497488 154; do
            # One line, no process substitution: curl's -w output has no
            # trailing newline, so `read` returns non-zero at EOF and
            # `bash -e` killed the step before it printed anything.
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "https://aifootball.am/player/$pid" || true)
            echo "  player/$pid -> ${out:-no answer}"
          done

          first=$(grep -o 'hl-[0-9]*' <<<"$board" | head -1)
          if [ -n "$first" ]; then
            echo "--- the match page for $first:"
            page=$(curl -sS --max-time 45 "https://aifootball.am/live/match/$first?_c=$(date +%s)")
            echo "bytes: ${#page}"
            grep -o '[^<>]\{0,50\}\(Կազմ\|Իրադարձ\|Վիճակագր\|Մարզադաշտ\|Մրցավար\)[^<>]\{0,50\}' <<<"$page" | sort -u | head -10
          fi

      # Who else has the Armenian league, and how much of it?
      #
      # Highlightly has the table, the fixtures and the live minute and
      # nothing else - no squad endpoint in any spelling, no top scorers.
      # ESPN's 218 soccer leagues do not include Armenia at all. So the
      # squads, the scoring chart and the player pages have no free source
      # YET, and "yet" is the word this step exists to test.
      #
      # The first candidate is the one already in the repository. The
      # photograph workflow pulls Armenian faces from TheSportsDB and has
      # filled three and a half thousand of them, which means that provider
      # knows Armenian squads by name. It has never been asked for the rest
      # of the row - position, shirt number, birth date - and if it has
      # them, the Armenian squad page comes back for nothing.
      - name: Who else has the Armenian league
        if: ${{ inputs.mode == 'sources' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          echo "=== TheSportsDB, which already gives this site Armenian faces"
          for club in Alashkert Pyunik Urartu Noah; do
            team=$(curl -sS --max-time 30 "https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=$club" || true)
            tid=$(grep -o '"idTeam":"[0-9]*"' <<<"$team" | head -1 | grep -o '[0-9]*' || true)
            echo "--- $club (idTeam ${tid:-none}, country $(grep -o '"strCountry":"[^"]*"' <<<"$team" | head -1))"
            [ -z "$tid" ] && continue
            squad=$(curl -sS --max-time 30 "https://www.thesportsdb.com/api/v1/json/3/lookup_all_players.php?id=$tid" || true)
            echo "    players named: $(grep -o '"strPlayer":' <<<"$squad" | wc -l)"
            echo "    fields on the first row:"
            head -c 1200 <<<"$squad" | tr ',' '\n' | grep -E '"(strPlayer|strPosition|strNumber|dateBorn|strNationality|strCutout|strThumb|strTeam)"' | head -10 | sed 's/^/      /'
          done

          echo
          echo "=== Bzzoiro (BSD), which advertises all of this for nothing"
          # A service offering what API-Football and Sportmonks charge for,
          # free and without a rate limit, is either very generous or very
          # short-lived. Neither matters if it does not have the league:
          # its own material names thirty-four, and every one of them
          # named is a big one. So the only question asked here is whether
          # Armenia is in its list at all.
          for path in /api/leagues /api/v1/leagues /leagues /api/competitions; do
            body=$(curl -sS --max-time 25 "https://sports.bzzoiro.com$path" || true)
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "https://sports.bzzoiro.com$path" || true)
            echo "--- $path -> http $code, ${#body} bytes"
            [ "${#body}" -lt 40 ] && continue
            echo "    armenia mentioned: $(grep -o -i -c armenia <<<"$body" || true)"
            echo "    first 300: $(head -c 300 <<<"$body" | tr '\n' ' ')"
          done

          echo
          echo "=== football-data.org, whose token this site already holds"
          comps=$(curl -sS --max-time 30 -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" "https://api.football-data.org/v4/competitions" || true)
          echo "    competitions on this plan: $(grep -o '"code":' <<<"$comps" | wc -l)"
          echo "    the plan's list: $(grep -o '"code":"[A-Z0-9]*"' <<<"$comps" | tr '\n' ' ')"
          echo "    anything Armenian: $(grep -c -i armenia <<<"$comps" || true)"

      - name: Does Highlightly fill a finished Armenian match?
        if: ${{ inputs.mode != 'site' && inputs.mode != 'sources' }}
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          DAY: ${{ inputs.date }}
        run: |
          cat > probe.mjs <<'JS'
          const KEY = process.env.HIGHLIGHTLY_KEY || "";
          if (!KEY) { console.log("no HIGHLIGHTLY_KEY"); process.exit(1); }
          // x-rapidapi-key, not x-api-key: the other one answers 403
          // "Missing mandatory HTTP Headers", which cost a day in
          // September when it shipped that way.
          const H = { "x-rapidapi-key": KEY, Accept: "application/json" };
          const HOST = "https://sports.highlightly.net/football";
          const LEAGUE = "291826";
          const day = process.env.DAY || new Date(Date.now() - 864e5).toISOString().slice(0, 10);

          const get = async (path) => {
            const r = await fetch(`${HOST}${path}`, { headers: H, signal: AbortSignal.timeout(20000) });
            const text = await r.text();
            let json = null;
            try { json = JSON.parse(text); } catch { /* not json */ }
            return { status: r.status, json, text };
          };

          // Print the shape, and for the arrays that decide this, the
          // first row whole. Round two printed shapes only and could
          // not tell "empty because not started" from "empty always".
          const shape = (v, depth = 0) => {
            const pad = "    ".repeat(depth + 1);
            if (Array.isArray(v)) return v.length ? `[${v.length}] of\n${shape(v[0], depth)}` : "[] EMPTY";
            if (v && typeof v === "object") {
              if (depth >= 2) return "{...}";
              return "\n" + Object.entries(v).slice(0, 16).map(([k, val]) => `${pad}${k}: ${shape(val, depth + 1)}`).join("\n");
            }
            return JSON.stringify(v)?.slice(0, 70) ?? String(v);
          };

          const ask = async (label, path, whole) => {
            try {
              const { status, json, text } = await get(path);
              console.log(`\n=== ${label}\n    ${path}\n    http ${status}`);
              if (!json) { console.log(`    ${text.slice(0, 200)}`); return null; }
              const body = Array.isArray(json) ? json : (json.data ?? json.response ?? json);
              console.log(`    ${shape(body)}`);
              if (whole) console.log(`    FIRST ROW WHOLE: ${JSON.stringify(whole(body))?.slice(0, 1200)}`);
              return body;
            } catch (e) { console.log(`\n=== ${label}\n    ${path}\n    ${String(e).slice(0, 150)}`); return null; }
          };

          // 1. Find a match that has actually been played. Guessing an
          // id is what wasted round two.
          const fixtures = await ask(`the matches of ${day}`, `/matches?leagueId=${LEAGUE}&date=${day}`);
          const played = (Array.isArray(fixtures) ? fixtures : []).find((m) => {
            const d = String(m?.state?.description || "").toLowerCase();
            return d.includes("finish") || d.includes("ended") || d.includes("ft");
          });
          if (!played) {
            console.log(`\nno finished match on ${day}. states: ${(fixtures || []).map((m) => m?.state?.description).join(", ") || "none"}`);
            console.log("re-run with a date that has one.");
            process.exit(0);
          }
          const ID = played.id;
          console.log(`\nreading ${played.homeTeam?.name} - ${played.awayTeam?.name}, id ${ID}`);
          // state.score printed WHOLE. Round two cut it off at two levels
          // and left lib/highlightly.ts reading five plausible spellings
          // instead of the one real one.
          console.log(`    state whole: ${JSON.stringify(played.state)}`);

          // 2. The three that decide it.
          await ask("lineups", `/lineups/${ID}`, (b) => b?.homeTeam);
          await ask("events", `/events/${ID}`, (b) => (Array.isArray(b) ? b.slice(0, 4) : b));
          await ask("statistics", `/statistics/${ID}`, (b) => (Array.isArray(b) ? b[0] : b));
          await ask("the match itself", `/matches/${ID}`, (b) => (Array.isArray(b) ? b[0]?.events?.slice(0, 3) : null));

          // 3. What /players will actually accept.
          //
          // Highlightly has no squad endpoint - /teams/{id}/squad and
          // /squads both answer 404 - but /players is real: it answered
          // 400 "property teamId should not exist" to the first round and
          // 200 to ?name=. A provider that names the property it rejects
          // can be asked which ones it wants, so this asks. If any of
          // these opens a squad, the Armenian squad page comes back
          // without a new provider.
          for (const param of ["teamName", "clubId", "team", "squadId", "leagueId", "countryCode", "season"]) {
            await ask(`players by ${param}`, `/players?${param}=${param === "leagueId" ? LEAGUE : "Shirak"}`);
          }

          // 4. The three the daily limit cut off last time.
          await ask("the leagues of a country", `/leagues?countryCode=AM`);
          await ask("last five games", `/last-five-games?teamId=${played.homeTeam?.id}`);
          await ask("a real player by id", `/players/7014119`, (b) => b);
          JS
          node probe.mjs
          rm -f probe.mjs
