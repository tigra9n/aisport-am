# What can the Armenian league be built from, for nothing?
#
# MEASURED on 6 September, from api-sports' own support and its pricing
# page: the free plan serves "only seasons between Y-4 and Y-2" - for
# 2026 that is 2022 to 2024 - and the restriction applies to every
# endpoint. So when the Pro subscription ends on 23 September, six
# things go with it: the Armenian squads, the Armenian player pages, the
# live minute, the Armenian scoring chart, the Armenian match centre and
# the weekly photograph refresh. The cheapest paid plan is $19 a month,
# $228 a year, and the owner wants the site to cost nothing.
#
# Highlightly is the only free candidate left. Two rounds have been run:
#
#   round 1 (6 Sep) - /standings works, /matches?leagueId=&date= works
#     and carries state.clock and state.score, /teams and /players
#     answered 400 "property X should not exist" (so they exist, asked
#     wrongly), /squads, /teams/{id}/squad, /top-scorers, /statistics
#     answered 404.
#   round 2 (6 Sep) - /teams?name=, /teams/{id}, /players?name= all 200
#     but carry nothing beyond id, name, logo. /matches/{id},
#     /lineups/{id}, /events/{id}, /statistics/{id} all 200 - the
#     endpoints are real - but every array in them was empty, because
#     the probe ran eleven minutes BEFORE kick-off. Then the day's
#     hundred requests ran out mid-run.
#
# So the one question that decides the 23 September cutover is still
# open: does Highlightly fill lineups, events and statistics once a
# match has actually been played? This round asks exactly that, on a
# FINISHED match, and nothing else - eight requests, not thirty.
name: Armenia for free

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Match day to read (YYYY-MM-DD). Empty = yesterday."
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Does Highlightly fill a finished Armenian match?
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          DAY: ${{ inputs.date }}
        run: |
          cat > probe.mjs <<'JS'
          const KEY = process.env.HIGHLIGHTLY_KEY || "";
          if (!KEY) { console.log("no HIGHLIGHTLY_KEY"); process.exit(1); }
          // x-rapidapi-key, not x-api-key: the other one answers 403
          // "Missing mandatory HTTP Headers", which cost a day in
          // September when it shipped that way.
          const H = { "x-rapidapi-key": KEY, Accept: "application/json" };
          const HOST = "https://sports.highlightly.net/football";
          const LEAGUE = "291826";
          const day = process.env.DAY || new Date(Date.now() - 864e5).toISOString().slice(0, 10);

          const get = async (path) => {
            const r = await fetch(`${HOST}${path}`, { headers: H, signal: AbortSignal.timeout(20000) });
            const text = await r.text();
            let json = null;
            try { json = JSON.parse(text); } catch { /* not json */ }
            return { status: r.status, json, text };
          };

          // Print the shape, and for the arrays that decide this, the
          // first row whole. Round two printed shapes only and could
          // not tell "empty because not started" from "empty always".
          const shape = (v, depth = 0) => {
            const pad = "    ".repeat(depth + 1);
            if (Array.isArray(v)) return v.length ? `[${v.length}] of\n${shape(v[0], depth)}` : "[] EMPTY";
            if (v && typeof v === "object") {
              if (depth >= 2) return "{...}";
              return "\n" + Object.entries(v).slice(0, 16).map(([k, val]) => `${pad}${k}: ${shape(val, depth + 1)}`).join("\n");
            }
            return JSON.stringify(v)?.slice(0, 70) ?? String(v);
          };

          const ask = async (label, path, whole) => {
            try {
              const { status, json, text } = await get(path);
              console.log(`\n=== ${label}\n    ${path}\n    http ${status}`);
              if (!json) { console.log(`    ${text.slice(0, 200)}`); return null; }
              const body = Array.isArray(json) ? json : (json.data ?? json.response ?? json);
              console.log(`    ${shape(body)}`);
              if (whole) console.log(`    FIRST ROW WHOLE: ${JSON.stringify(whole(body))?.slice(0, 1200)}`);
              return body;
            } catch (e) { console.log(`\n=== ${label}\n    ${path}\n    ${String(e).slice(0, 150)}`); return null; }
          };

          // 1. Find a match that has actually been played. Guessing an
          // id is what wasted round two.
          const fixtures = await ask(`the matches of ${day}`, `/matches?leagueId=${LEAGUE}&date=${day}`);
          const played = (Array.isArray(fixtures) ? fixtures : []).find((m) => {
            const d = String(m?.state?.description || "").toLowerCase();
            return d.includes("finish") || d.includes("ended") || d.includes("ft");
          });
          if (!played) {
            console.log(`\nno finished match on ${day}. states: ${(fixtures || []).map((m) => m?.state?.description).join(", ") || "none"}`);
            console.log("re-run with a date that has one.");
            process.exit(0);
          }
          const ID = played.id;
          console.log(`\nreading ${played.homeTeam?.name} - ${played.awayTeam?.name}, id ${ID}, state ${played.state?.description}, score ${JSON.stringify(played.state?.score)}`);

          // 2. The three that decide it.
          await ask("lineups", `/lineups/${ID}`, (b) => b?.homeTeam);
          await ask("events", `/events/${ID}`, (b) => (Array.isArray(b) ? b.slice(0, 4) : b));
          await ask("statistics", `/statistics/${ID}`, (b) => (Array.isArray(b) ? b[0] : b));
          await ask("the match itself", `/matches/${ID}`, (b) => (Array.isArray(b) ? b[0]?.events?.slice(0, 3) : null));

          // 3. The three the daily limit cut off last time.
          await ask("the leagues of a country", `/leagues?countryCode=AM`);
          await ask("last five games", `/last-five-games?teamId=${played.homeTeam?.id}`);
          await ask("a real player by id", `/players/7014119`, (b) => b);
          JS
          node probe.mjs
          rm -f probe.mjs
