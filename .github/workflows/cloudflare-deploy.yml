name: Deploy to Cloudflare

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - cloudflare-deploy

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch live site and headers
        run: |
          echo "=== HEADERS for https://aisport.am/live ===" > diagnose.txt
          curl -s -D - -o /tmp/body.html "https://aisport.am/live?_diag=$(date +%s)" >> diagnose.txt
          echo "" >> diagnose.txt
          echo "=== BODY (first 4000 chars) ===" >> diagnose.txt
          head -c 4000 /tmp/body.html >> diagnose.txt
          echo "" >> diagnose.txt
          echo "=== grep for tell-tale strings ===" >> diagnose.txt
          grep -o "match-row-link\|match-expand\|ինքնաշխատ\|match-modal" /tmp/body.html | sort -u >> diagnose.txt || true
      - name: Upload diagnostic
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f diagnose.txt
          git commit -m "Diagnostic output [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:deploy-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: aisport-am
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          bash scripts/cf-deploy.sh 2>&1 | tee /tmp/deploy-log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload log for debugging
        if: always()
        run: |
          cp /tmp/deploy-log.txt deploy-log.txt || echo "no log" > deploy-log.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f deploy-log.txt
          git commit -m "Deploy log [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:deploy-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
