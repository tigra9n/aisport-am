name: Deploy to Cloudflare

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - cloudflare-deploy
    paths:
      - 'aisport-am/**'
      - '.github/workflows/cloudflare-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: aisport-am
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The bundler does not type-check, so an identifier that does not
      # exist compiles cleanly and then throws at request time (Cloudflare
      # error 1101) - that is how a crashing /opinions/ page once reached
      # production. This step fails the deploy instead.
      - name: Type-check
        run: npm run typecheck

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed so callModel() can rescue an article when Anthropic
          # rejects the call for an exhausted balance. Note this only makes
          # the key available - it does NOT switch providers; without
          # CONTENT_MODEL_PROVIDER=gemini, Claude stays primary and Gemini
          # is used solely for that billing-failure fallback.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          # Absent until the page token is issued; the deploy script skips
          # any secret whose value is empty, so this changes nothing until
          # both are set.
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          bash scripts/cf-deploy.sh 2>&1 | tee /tmp/deploy-log.txt
          exit ${PIPESTATUS[0]}

      # Types cannot see a route that throws on real data, a page that 404s
      # because a lookup broke, or a template that renders empty. This opens
      # one page of every type on the deployed site and fails the run if any
      # of them is not a real page.
      - name: Smoke-test the deployed site
        run: node scripts/smoke.mjs

      - name: Upload log for debugging
        if: always()
        run: |
          cp /tmp/deploy-log.txt deploy-log.txt || echo "no log" > deploy-log.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f deploy-log.txt
          git commit -m "Deploy log [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:deploy-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
