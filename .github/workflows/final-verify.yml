name: Final Verify

on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-verify.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Single check
        run: |
          HTML=$(curl -s "https://aisport.am/live?_c=$(date +%s)")
          echo "match count: $(echo "$HTML" | grep -oE 'af-[0-9]+' | sort -u | wc -l)" > final-verify.txt
          MID=$(echo "$HTML" | grep -oE 'af-[0-9]+' | sort -u | head -1)
          echo "testing $MID" >> final-verify.txt
          curl -s -w "\nHTTP %{http_code}\n" "https://aisport.am/api/live/match/$MID?_c=$(date +%s)" | head -c 600 >> final-verify.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f final-verify.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
