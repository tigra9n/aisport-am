name: Check Amiens Match

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-amiens.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo 'import json' > /tmp/teams.py
          echo 'd=json.load(sys.stdin)' >> /tmp/teams.py
          echo 'import sys' >> /tmp/teams.py
          echo 'd=json.load(sys.stdin)' >> /tmp/teams.py
          echo 'fx=d["response"][0]' >> /tmp/teams.py
          echo 'print("home:", fx["teams"]["home"]["name"])' >> /tmp/teams.py
          echo 'print("away:", fx["teams"]["away"]["name"])' >> /tmp/teams.py
          echo "=== Raw fixture teams for 1552729 ===" > check-amiens.txt
          curl -s "https://v3.football.api-sports.io/fixtures?id=1552729" -H "x-apisports-key: ${AFKEY}" | python3 /tmp/teams.py >> check-amiens.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f check-amiens.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
