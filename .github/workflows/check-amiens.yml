name: Check Amiens Match

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-amiens.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo 'import json' > /tmp/s.py
          echo 'd=json.load(open("/tmp/p.json"))' >> /tmp/s.py
          echo 'print("lineups:", len(d.get("lineups",[])), "stats:", len(d.get("statistics",[])), "events:", len(d.get("events",[])))' >> /tmp/s.py
          echo "=== Our popup for af-1552729 ===" > check-amiens.txt
          curl -s "https://aisport.am/api/live/match/af-1552729?_c=$(date +%s)" > /tmp/p.json
          python3 /tmp/s.py >> check-amiens.txt
          echo "" >> check-amiens.txt
          echo "=== Raw events endpoint ===" >> check-amiens.txt
          curl -s "https://v3.football.api-sports.io/fixtures/events?fixture=1552729" -H "x-apisports-key: ${AFKEY}" | head -c 500 >> check-amiens.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f check-amiens.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
