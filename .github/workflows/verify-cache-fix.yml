name: Verify Cache Fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-cache-fix.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check without any cache-buster (matching real user requests)
        run: |
          echo "=== No cache-buster, like a real browser request ===" > verify-cache.txt
          curl -s "https://aisport.am/api/live/match/af-1552729" | head -c 400 >> verify-cache.txt
          echo "" >> verify-cache.txt
          echo "=== headers ===" >> verify-cache.txt
          curl -sI "https://aisport.am/api/live/match/af-1552729" >> verify-cache.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f verify-cache.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
