# The footballers' names in Armenian, asked of the model that already
# writes the articles.
#
# The hand-written table in lib/player-names-hy.ts is right by
# construction and always wins, but it holds a couple of hundred names
# against several thousand footballers. Everyone else falls through to
# translit-hy.ts, which spells a name letter by letter without knowing what
# language it is - and that is where "Ben White" became "Բեն Վհիտե" and
# "Michael Keane" became "Միքայել Կեանե". No rule fixes that: the same
# letters are said differently in English, Spanish and Portuguese, and the
# roster does not say which.
#
# A model does know. So this asks it, in batches, for the names the table
# does not carry, checks every answer before it is kept, and writes them
# into the same hand-written table - where they can be corrected by hand
# like every other name in it. Nothing here reaches the site until the
# change is reviewed and merged.
name: Name fill

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'One league slug, or all'
        type: choice
        options: ['all', 'arm', 'eng.1', 'esp.1', 'ita.1', 'ger.1', 'fra.1', 'usa.1', 'ksa.1']
        default: 'all'
      limit:
        description: 'How many names to ask for at most'
        required: false
        default: '400'
      apply:
        description: 'Commit the names to this branch (no = print them only)'
        type: choice
        options: ['no', 'yes']
        default: 'no'

jobs:
  fill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: aisport-am
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Ask for the names and check every answer
        env:
          ONLY: ${{ github.event.inputs.league || 'all' }}
          LIMIT: ${{ github.event.inputs.limit || '400' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          cat > name-fill.mts <<'TS'
          import { readFileSync, writeFileSync } from "node:fs";
          import { espnTeams, espnSquad } from "./lib/espn.ts";

          const KEY = process.env.GEMINI_API_KEY || "";
          if (!KEY) { console.log("no GEMINI_API_KEY"); process.exit(1); }
          const SLUGS = ["eng.1", "esp.1", "ita.1", "ger.1", "fra.1", "usa.1", "ksa.1"];
          const only = process.env.ONLY && process.env.ONLY !== "all"
            // "arm" is not an ESPN slug - it is handled below, on its own.
            ? SLUGS.filter((slug) => slug === process.env.ONLY)
            : SLUGS;
          const limit = Number(process.env.LIMIT) || 400;

          const FILE = "lib/player-names-hy.ts";
          const source = readFileSync(FILE, "utf8");
          // Every key in the object, not every key that starts a line. The
          // first run of this asked for 113 names the table already had,
          // wrote them in a second time, and the file stopped compiling:
          // "An object literal cannot have multiple properties with the
          // same name." The table packs several names per line.
          const region = source.slice(source.indexOf("const playerNames"), source.indexOf("\n};\n\nfunction lookupKey"));
          const table = new Set([...region.matchAll(/"([^"]+)"\s*:/g)].map((m) => m[1]));
          // The same key the module itself builds, so a name this run adds
          // is a name the site will actually find.
          const key = (name: string) => name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’‘`]/g, "'").replace(/\s+/g, " ").trim().toLowerCase();

          // Who is missing, with the club they play for: the club is the
          // only clue the roster gives about what language the name is in,
          // and it is the difference between Խիմենես and Ջիմենեզ.
          const missing = new Map<string, { name: string; club: string; league: string }>();
          // The Armenian league first, because it is the one this site
          // exists for and the one ESPN does not carry: its 218 soccer
          // competitions do not include it, so not one Armenian footballer
          // was in the count that said 4330. They come from API-Football,
          // which is where the Armenian squad pages come from too.
          if (process.env.ONLY === "all" || process.env.ONLY === "arm") {
            const afKey = process.env.API_FOOTBALL_KEY || "";
            const af = async (path: string) => {
              try {
                const r = await fetch(`https://v3.football.api-sports.io${path}`, { headers: { "x-apisports-key": afKey, Accept: "application/json" } });
                return r.ok ? await r.json() as { response?: unknown[] } : null;
              } catch { return null; }
            };
            const season = new Date().getUTCMonth() + 1 >= 7 ? new Date().getUTCFullYear() : new Date().getUTCFullYear() - 1;
            const teams = (await af(`/teams?league=342&season=${season}`))?.response as { team?: { id?: number; name?: string } }[] ?? [];
            for (const entry of teams) {
              if (!entry.team?.id) continue;
              const squad = ((await af(`/players/squads?team=${entry.team.id}`))?.response as { players?: { name?: string }[] }[] ?? [])[0]?.players ?? [];
              for (const player of squad) {
                const k = key(player.name ?? "");
                if (!k || table.has(k) || missing.has(k)) continue;
                missing.set(k, { name: player.name as string, club: entry.team.name ?? "", league: "Armenian Premier League" });
              }
            }
            console.log(`arm: ${teams.length} clubs, ${missing.size} unnamed so far`);
          }

          for (const slug of only) {
            const clubs = await espnTeams(slug);
            for (let start = 0; start < clubs.length; start += 5) {
              const batch = clubs.slice(start, start + 5);
              const rosters = await Promise.all(batch.map((club) => espnSquad(slug, club.id).catch(() => null)));
              rosters.forEach((roster, offset) => {
                for (const player of roster?.players ?? []) {
                  const k = key(player.name);
                  if (!k || table.has(k) || missing.has(k)) continue;
                  missing.set(k, { name: player.name, club: batch[offset].name, league: slug });
                }
              });
            }
            console.log(`${slug}: ${missing.size} unnamed so far`);
          }

          const wanted = [...missing.entries()].slice(0, limit);
          console.log(`${missing.size} footballers the table does not name; asking for ${wanted.length}`);

          const SYSTEM = [
            "You transliterate footballers' names into Armenian for an Armenian football site.",
            "Transliterate the sound of the name as it is said in the player's own language - never translate it, never substitute a different person's name, never add a patronymic or a nickname.",
            "The club and league are given so you can tell which language the name belongs to: the same letters are said differently in English, Spanish, Portuguese, Italian, German, French, Dutch, Arabic and Japanese.",
            "Armenian conventions this site follows:",
            "- a word-initial e is written Է and a word-initial o is written Օ, because ե and ո are read 'ye' and 'vo' at the start of a word",
            "- a name opens with the rolled Ռ, not Ր",
            "- an Armenian footballer gets his name back, not a transliteration of the Latin spelling of it: Spertsyan is Սպերցյան, Mkhitaryan is Մխիթարյան, Bichakhchyan is Բիչախչյան, and a surname in -yan ends -յան",
            "- Spanish and Portuguese surnames ending -ez end in -ես (Խիմենես, Ֆերնանդես), and Spanish j is խ",
            "- Portuguese final unstressed o is ու (Ռոնալդու, Ռամուշ) and nh/lh are նյ/լյ",
            "- English silent letters are not written (Ուայթ, not Վհիտե; Քին, not Կեանե)",
            "- German ei is այ, eu is ոյ, z is ց, w is վ, sch is շ",
            "- Italian c before e/i is չ, ch is կ, gn is նյ, gli is լյ",
            "Answer with a JSON array of {\"latin\":..., \"hy\":...} and nothing else. Use exactly the latin spelling you were given. Every hy value must be Armenian letters only.",
          ].join("\n");

          // A hundred a request. The answer is about 25 tokens a name, so
          // a batch this size is a quarter of what the model may write
          // back, and it turns four thousand names into forty-two requests
          // rather than seventy - inside a day's allowance either way, but
          // half the wall clock.
          const BATCH = 100;
          const wait = (ms: number) => new Promise((r) => setTimeout(r, ms));
          const armenianOnly = /^[Ա-֏\s'’.\-]+$/;
          const accepted: [string, string][] = [];
          const written = new Set<string>();
          let asked = 0, refused = 0;

          for (let start = 0; start < wanted.length; start += BATCH) {
            const batch = wanted.slice(start, start + BATCH);
            const payload = batch.map(([, v]) => ({ latin: v.name, club: v.club, league: v.league }));
            let text: string | null = null;
            // Three tries: the free tier allows ten requests a minute and a
            // 429 here is a pause, not a failure.
            for (let attempt = 0; attempt < 3 && !text; attempt++) {
              asked++;
              try {
              const response = await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=" + encodeURIComponent(KEY),
                {
                  method: "POST",
                  // MEASURED the hard way: a run sat on one batch for an
                  // hour with nothing in the log, because fetch without a
                  // signal waits for ever and a connection that never
                  // answers never fails. Two minutes is far more than a
                  // batch has ever taken - the ones that answered took
                  // about thirty-five seconds - and a timeout here is the
                  // same as a 503: wait, then ask again.
                  signal: AbortSignal.timeout(120000),
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    system_instruction: { parts: [{ text: SYSTEM }] },
                    contents: [{ role: "user", parts: [{ text: JSON.stringify(payload) }] }],
                    generationConfig: { maxOutputTokens: 8192, temperature: 0.2, responseMimeType: "application/json" },
                  }),
                },
              );
              // 429 is the rate limit and 503 is "this model is currently
              // experiencing high demand", which is what the first run met
              // on its first batch - and it gave up on that batch and lost
              // sixty names to a refusal that says "try again later" in
              // its own body. Both are a pause.
              if (response.status === 429 || response.status >= 500) {
                console.log(`  http ${response.status}, waiting`);
                await wait(20000);
                continue;
              }
              if (!response.ok) { console.log(`  http ${response.status}: ${(await response.text()).slice(0, 300)}`); break; }
              const data = await response.json() as { candidates?: { content?: { parts?: { text?: string }[] } }[] };
              text = data.candidates?.[0]?.content?.parts?.map((p) => p.text ?? "").join("") || null;
              } catch (err) {
                console.log(`  ${String(err)}, waiting`);
                await wait(10000);
              }
            }
            if (!text) { console.log(`  batch ${start / BATCH + 1}: no answer`); continue; }
            let rows: { latin?: string; hy?: string }[] = [];
            try { rows = JSON.parse(text); } catch { console.log(`  batch ${start / BATCH + 1}: unparseable`); continue; }
            const asKey = new Map(batch.map(([k, v]) => [key(v.name), k]));
            for (const row of rows) {
              const k = asKey.get(key(row.latin ?? ""));
              // A name that was not asked for, or an answer with Latin
              // letters in it, is dropped rather than written down: this
              // file is the one place the site trusts completely.
              if (!k || !row.hy || !armenianOnly.test(row.hy)) { refused++; continue; }
              // Belt as well as braces: a batch that answers for the same
              // man twice would write the key twice and break the file the
              // same way.
              if (written.has(k)) { refused++; continue; }
              written.add(k);
              accepted.push([k, row.hy.trim()]);
            }
            console.log(`  batch ${start / BATCH + 1} of ${Math.ceil(wanted.length / BATCH)} at ${new Date().toISOString().slice(11, 19)}: ${rows.length} back, ${accepted.length} kept so far`);
            await wait(7000);
          }

          console.log(`\n${asked} requests, ${accepted.length} names accepted, ${refused} refused`);
          for (const [latin, hy] of accepted.slice(0, 40)) console.log(`    ${latin}  ->  ${hy}`);

          if (!accepted.length) process.exit(0);
          const today = new Date().toISOString().slice(0, 10);
          const block = [
            "",
            `  // Asked of the model on ${today}, ${accepted.length} names the rules were`,
            "  // spelling letter by letter without knowing the language. Every answer",
            "  // was checked to be Armenian script and to be a name that was asked",
            "  // for; the rest were dropped. Correct any of them by hand - this table",
            "  // wins over everything.",
            ...accepted.map(([latin, hy]) => `  ${JSON.stringify(latin)}: ${JSON.stringify(hy)},`),
          ].join("\n");
          const marker = "\n};\n\nfunction lookupKey";
          if (!source.includes(marker)) { console.log("could not find where the table ends"); process.exit(1); }
          writeFileSync(FILE, source.replace(marker, `${block}\n};\n\nfunction lookupKey`));
          console.log(`\n${FILE} written`);
          TS
          npx tsx name-fill.mts
          rm -f name-fill.mts

      - name: Prove the file still compiles and the name tests still pass
        # Quietly unless something breaks. The default reporter prints
        # eleven lines per test, and forty-six of those buried the only
        # part of this run worth reading - which names came back and which
        # were refused. Passing --test-reporter through npm does not work:
        # the flag lands after the file arguments and is ignored. So the
        # output goes to a file and is printed only on a failure.
        run: |
          npm run typecheck
          npm run test:units > test-output.txt 2>&1 || { cat test-output.txt; exit 1; }
          grep -E "^# (tests|pass|fail)" test-output.txt
          rm -f test-output.txt

      - name: Commit them
        if: ${{ github.event.inputs.apply == 'yes' }}
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- aisport-am/lib/player-names-hy.ts; then echo "nothing to commit"; exit 0; fi
          git add aisport-am/lib/player-names-hy.ts
          git commit -m "Name the footballers the rules were spelling letter by letter

          The table holds a couple of hundred names against several thousand
          footballers, and everyone else was spelled out by rule without
          knowing what language the name is in. These came from the model
          that writes the articles, every answer checked to be Armenian
          script and to be a name that was asked for, and they go in the
          hand-written table where they can be corrected."
          git push origin HEAD:${{ github.ref_name }}
