name: Test All Modes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-modes.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          sleep 90
          echo "=== mode=rss (fresh) ===" > test.txt
          curl -s -w "\ncurl_exit=%{exitcode}, http=%{http_code}, time=%{time_total}s\n" --max-time 45 "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}&mode=rss&_c=$(date +%s)" >> test.txt 2>&1 || true
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f test.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
