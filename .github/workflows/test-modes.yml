name: Test Content Cron

# Manual diagnostic: hits /api/cron/content?mode=<recap|preview|rss> directly
# and pushes the raw response to the check-logs branch. Useful for testing
# content generation without waiting for the next scheduled cron tick.
#
# To run: go to Actions -> Test Content Cron -> Run workflow, pick a mode,
# then check the check-logs branch for test.txt.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Content mode to test'
        required: true
        default: 'rss'
        type: choice
        options: [recap, preview, rss]
  push:
    branches: [main]
    paths: ['.github/workflows/test-modes.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          MODE="${{ github.event.inputs.mode || 'rss' }}"
          echo "=== mode=$MODE ===" > test.txt
          curl -s -w "\ncurl_exit=%{exitcode}, http=%{http_code}, time=%{time_total}s\n" --max-time 65 "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}&mode=$MODE&_c=$(date +%s)" >> test.txt 2>&1 || true
          echo "" >> test.txt
          echo "=== apitube category.id titles ===" >> test.txt
          curl -s --max-time 20 "https://api.apitube.io/v1/news/everything?api_key=api_live_mJtfBal8Rto7RasWjxIQFWCMSV6AoCULOoCYVvvLTaCmEuWNY9cNg3&category.id=medtop:15000000&per_page=8&language.code=en" -H "Content-Type: application/json" 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print([r.get('title') for r in d.get('results',[])])" >> test.txt 2>&1
          echo "" >> test.txt
          echo "=== apitube title keyword titles ===" >> test.txt
          curl -s --max-time 20 -G "https://api.apitube.io/v1/news/everything" \
            --data-urlencode "api_key=api_live_mJtfBal8Rto7RasWjxIQFWCMSV6AoCULOoCYVvvLTaCmEuWNY9cNg3" \
            --data-urlencode "title=football,basketball,soccer,NBA,tennis,UEFA" \
            --data-urlencode "language.code=en" \
            --data-urlencode "per_page=8" 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print([r.get('title') for r in d.get('results',[])])" >> test.txt 2>&1
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f test.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
