name: Test All Modes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-modes.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          sleep 90
          echo "=== mode=ping ===" > test.txt
          curl -s --max-time 15 "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}&mode=ping&_c=$(date +%s)" >> test.txt
          echo "" >> test.txt
          echo "=== mode=ping2 ===" >> test.txt
          curl -s --max-time 20 "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}&mode=ping2&_c=$(date +%s)" >> test.txt
          echo "" >> test.txt
          echo "=== mode=rss (fresh) ===" >> test.txt
          curl -s --max-time 30 "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}&mode=rss&_c=$(date +%s)" >> test.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f test.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
