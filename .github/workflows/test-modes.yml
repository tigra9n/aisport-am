name: Test Content Cron

# Manual diagnostic: hits /api/cron/content?mode=<recap|preview|rss> directly
# and pushes the raw response to the check-logs branch. Useful for testing
# content generation without waiting for the next scheduled cron tick.
#
# To run: go to Actions -> Test Content Cron -> Run workflow, pick a mode,
# uhen check the check-logs branch for test.txt.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Content mode to test'
        required: true
        default: 'rss'
        type: choice
        options: [recap, preview, rss]
  push:
    branches: [main]
    paths: ['.github/workflows/test-modes.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo "=== article page og:image (with cache-buster) ===" > test.txt
          curl -s -w "\nhttp=%{http_code}\n" --max-time 20 "https://aisport.am/news/ley-ompsony-ayamium-anisi-koghqin-87787400?_cb=$(date +%s)" 2>&1 | grep -oE 'og:image[^/]*content="[^"]*"' >> test.txt
          echo "" >> test.txt
          echo "=== category in D1 for id=9 ===" >> test.txt
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f test.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
