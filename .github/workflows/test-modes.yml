name: Test Content Cron

# Manual diagnostic: hits /api/cron/content?mode=<recap|preview|rss> directly
# and pushes the raw response to the check-logs branch. Useful for testing
# content generation without waiting for the next scheduled cron tick.
#
# To run: go to Actions -> Test Content Cron -> Run workflow, pick a mode,
# uhen check the check-logs branch for test.txt.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Content mode to test'
        required: true
        default: 'rss'
        type: choice
        options: [recap, preview, rss]
  push:
    branches: [main]
    paths: ['.github/workflows/test-modes.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          MODE="${{ github.event.inputs.mode || 'rss' }}"
          echo "=== mode=$MODE source=apitube ===" > test.txt
          curl -s -w "\ncurl_exit=%{exitcode}, http=%{http_code}, time=%{time_total}s\n" --max-time 130 "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}&mode=$MODE&source=apitube&_c=$(date +%s)6" >> test.txt 2>&1 || true
          echo "" >> test.txt
          echo "=== apitube bridge raw titles ===" >> test.txt
          curl -s --max-time 20 "https://aisport.am/api/feeds/apitube?api_key=api_live_mJtfBal8Rto7RasWjxIQFWCMSV6AoCULOoCYVvvLTaCmEuWNY9cNg3&category_id=medtop:15000000&per_page=10&debug=1" >> test.txt
          echo "" >> test.txt
          echo "=== apitube bridge EXACT stored feed_url (per_page=20, no debug) ===" >> test.txt
          curl -s -w "\nhttp=%{http_code}\n" --max-time 20 "https://aisport.am/api/feeds/apitube?api_key=api_live_mJtfBal8Rto7RasWjxIQFWCMSV6AoCULOoCYVvvLTaCmEuWNY9cNg3&category_id=medtop:15000000&per_page=20" 2>&1 | head -c 1500 >> test.txt
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f test.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
