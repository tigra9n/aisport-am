name: Test Content Cron

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Content mode to test'
        required: true
        default: 'rss'
        type: choice
        options: [recap, preview, rss]
  push:
    branches: [main]
    paths: ['.github/workflows/test-modes.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo "=== homepage response headers ===" > test.txt
          curl -sI --max-time 20 "https://aisport.am/" 2>&1 >> test.txt
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f test.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
