name: Warm Match Cache

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the cache
        run: |
          curl -s -w "\nHTTP %{http_code}\n" "https://aisport.am/api/cron/warm?token=${CRON_TOKEN}"
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
