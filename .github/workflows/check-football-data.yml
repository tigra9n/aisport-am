name: Check Football Data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-football-data.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check football-data.org for today
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          echo "=== Today's date check ===" > fd-check.txt
          date -u >> fd-check.txt
          for CODE in CL PL PD SA BL1 FL1; do
            echo "=== $CODE ===" >> fd-check.txt
            curl -s "https://api.football-data.org/v4/competitions/$CODE/matches?dateFrom=2026-08-23&dateTo=2026-08-23" -H "X-Auth-Token: $TOKEN" | head -c 800 >> fd-check.txt
            echo "" >> fd-check.txt
            sleep 6
          done
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f fd-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
