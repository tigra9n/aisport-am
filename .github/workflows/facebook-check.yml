name: Check the Facebook token

# Answers one question, without publishing anything: is the token in
# META_PAGE_ACCESS_TOKEN the right kind, for the right Page, with the right
# permission, and does it expire?
#
# Worth having as a button rather than a one-off command. A page token can
# be revoked from the Facebook side at any time - the password changes, the
# app is removed, someone resets the app secret - and when that happens the
# site keeps publishing and simply stops appearing on the page. This says
# so in ten seconds.
#
# Every call here is a GET. Nothing is posted.

on:
  workflow_dispatch: {}
  # Every Monday morning. A page token lasts about two months and this one
  # expires in November, so the site would otherwise go quiet on Facebook
  # one Tuesday with nothing to say why. The job fails when there are less
  # than fourteen days left, which is what sends the email.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Facebook what this token is
        env:
          TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          if [ -z "$TOKEN" ]; then echo "META_PAGE_ACCESS_TOKEN is not set"; exit 1; fi
          if [ -z "$PAGE_ID" ]; then echo "META_PAGE_ID is not set"; exit 1; fi
          echo "META_PAGE_ID = $PAGE_ID"
          echo

          # Who does this token belong to? A page token answers with the
          # page; a user token answers with the person, which is the whole
          # difference we are looking for.
          echo "=== who the token belongs to ==="
          curl -s --max-time 20 "https://graph.facebook.com/v26.0/me?fields=id,name,category&access_token=$TOKEN" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                let j; try { j = JSON.parse(d) } catch { console.log("  unreadable answer: " + d.slice(0,200)); process.exit(0) }
                if (j.error) { console.log("  ERROR: " + j.error.message); process.exit(0) }
                console.log("  id:       " + j.id);
                console.log("  name:     " + j.name);
                console.log("  category: " + (j.category ?? "(none - this looks like a person, not a page)"));
              })'
          echo

          # And what kind of token is it? debug_token names the type and the
          # expiry outright, which is the pair that matters: Page, never.
          echo "=== what kind of token it is ==="
          curl -s --max-time 20 "https://graph.facebook.com/v26.0/debug_token?input_token=$TOKEN&access_token=$TOKEN" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                let j; try { j = JSON.parse(d) } catch { console.log("  unreadable answer"); process.exit(0) }
                if (j.error) { console.log("  ERROR: " + j.error.message); process.exit(0) }
                const t = j.data ?? {};
                console.log("  type:    " + t.type + (t.type === "PAGE" ? "  OK" : "  <- should be PAGE"));
                console.log("  expires: " + (t.expires_at ? new Date(t.expires_at * 1000).toISOString() + "  <- should never expire" : "never  OK"));
                console.log("  valid:   " + t.is_valid);
                console.log("  scopes:  " + (t.scopes ?? []).join(", "));
                console.log("  page:    " + (t.profile_id ?? t.user_id ?? "?"));
              })'
          echo

          # Whether the token belongs to the page the site posts to. Asking
          # the page for its `tasks` was the obvious check and the wrong one:
          # that field only exists on the entries /me/accounts returns for a
          # person, and a page asked about itself answers "nonexisting field
          # (tasks)" - a failure that means nothing. Permission to publish is
          # already settled above, by pages_manage_posts in the scopes.
          echo "=== is it the page the site posts to ==="
          curl -s --max-time 20 "https://graph.facebook.com/v26.0/me?fields=id&access_token=$TOKEN" \
            | PAGE_ID="$PAGE_ID" node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                let j; try { j = JSON.parse(d) } catch { console.log("  unreadable answer"); process.exit(1) }
                if (j.error) { console.log("  ERROR: " + j.error.message); process.exit(1) }
                const same = String(j.id) === String(process.env.PAGE_ID);
                console.log(same ? "  the token is for META_PAGE_ID - correct" : `  MISMATCH: the token is for ${j.id}, the site posts to ${process.env.PAGE_ID}`);
                process.exit(same ? 0 : 1);
              })'
          echo

          # The question the token cannot answer: has anything actually been
          # posted? Every check above can pass while the page stays empty -
          # a token is permission, not evidence.
          echo "=== the last few posts on the page ==="
          curl -s --max-time 20 "https://graph.facebook.com/v26.0/me/feed?fields=created_time,message,permalink_url&limit=5&access_token=$TOKEN" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                let j; try { j = JSON.parse(d) } catch { console.log("  unreadable answer"); process.exit(0) }
                if (j.error) {
                  const m = j.error.message ?? "";
                  if (j.error.code === 10 || /Page Public Content Access/i.test(m)) {
                    console.log("  cannot read the posts on this page from here, and that is expected.");
                    console.log("  Since the app went Live on 4 September, reading a Page feed needs the");
                    console.log("  Page Public Content Access feature. Publishing does not, so posting is");
                    console.log("  unaffected - pages_manage_posts is in the scopes above.");
                    console.log("  For evidence that posts are landing, run the workflow");
                    console.log("  \"What happened to the social posts\": it reads our own publication_logs,");
                    console.log("  which stores the post id Facebook returned for every attempt.");
                    process.exit(0);
                  }
                  console.log("  ERROR: " + m); process.exit(0);
                }
                const posts = j.data ?? [];
                if (!posts.length) { console.log("  nothing has been posted to this page yet"); process.exit(0) }
                for (const p of posts) {
                  const when = new Date(p.created_time);
                  const mins = Math.round((Date.now() - when.getTime()) / 60000);
                  const ago = mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} d ago`;
                  console.log(`  ${when.toISOString().slice(0, 16).replace("T", " ")}  (${ago})`);
                  console.log(`    ${(p.message ?? "(no text)").split("\n")[0].slice(0, 90)}`);
                }
              })'
          echo

          # And the one thing a green check cannot tell you by itself: how
          # long this stays true.
          echo "=== how long is left ==="
          curl -s --max-time 20 "https://graph.facebook.com/v26.0/debug_token?input_token=$TOKEN&access_token=$TOKEN" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                let j; try { j = JSON.parse(d) } catch { process.exit(1) }
                const at = j.data?.expires_at;
                if (!at) { console.log("  the token does not expire"); process.exit(0) }
                const days = Math.round((at * 1000 - Date.now()) / 86400000);
                console.log(`  ${days} days left (expires ${new Date(at * 1000).toISOString().slice(0, 10)})`);
                if (days > 14) { console.log("  fine for now"); process.exit(0) }
                console.log("  RENEW IT: Facebook posting stops when this runs out.");
                console.log("  Graph API Explorer -> User Token -> Generate -> me/accounts,");
                console.log("  take the page access_token, Extend Access Token in the debugger,");
                console.log("  then update the META_PAGE_ACCESS_TOKEN secret and redeploy.");
                process.exit(1);
              })'
