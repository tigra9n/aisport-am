name: Debug Popup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-popup.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch debug response
        run: |
          curl -s -w "\nHTTP %{http_code}\n" "https://aisport.am/api/live/match/af-1550088?_c=$(date +%s)" > debug-popup.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f debug-popup.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
