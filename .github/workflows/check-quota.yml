name: Check Quota

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-quota.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check quota
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          curl -s "https://v3.football.api-sports.io/status" -H "x-apisports-key: $AFKEY" > quota-check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f quota-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
