name: Audit the live site

# The three measuring scripts at the root of this repository all run a real
# browser against the deployed site, so they cannot run anywhere that cannot
# reach it. This runs them on demand and puts the report where it can be
# read afterwards.
#
# It is deliberately separate from add-source.yml, which also runs audit.mjs
# but carries a pile of one-off diagnostics beside it - including steps that
# write to the production database. Nothing here writes anything: it opens
# pages and reports what it finds.

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also measure page weight and Core Web Vitals (slower)'
        required: false
        default: true
        type: boolean
      league:
        description: 'API-Football league id to interrogate (342 = Armenian Premier League)'
        required: false
        default: '342'
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install a browser
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4.10.2
          npx playwright install --with-deps chromium

      # Every script is allowed to fail without failing the run: a report
      # that is missing one section is still worth reading, and a check that
      # throws is itself a finding.
      - name: Audit every page type
        run: node audit.mjs || true

      - name: Page weight and overflow
        if: ${{ inputs.full }}
        run: node page-weight.mjs > weight.txt 2>&1 || true

      - name: Core Web Vitals
        if: ${{ inputs.full }}
        run: node vitals.mjs > vitals.txt 2>&1 || true

      # Accessibility was the one section of the report that was a guess:
      # "no missing alt, contrast readable" is two questions out of dozens.
      - name: Accessibility
        run: node a11y.mjs > a11y.txt 2>&1 || true

      # Asked when the Armenian league sat at "- : -" for over an hour while
      # the English matches on the same page ticked along. The site reads one
      # /fixtures?date= call for every league at once, so a league that does
      # not move while its neighbours do is the provider's answer, not ours.
      # API-Football publishes a per-league coverage block that says outright
      # whether it carries live data for a competition.
      - name: What the football API says about a league
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LEAGUE: ${{ inputs.league }}
        run: |
          L="${LEAGUE:-342}"
          TODAY=$(TZ=Asia/Yerevan date +%F)
          {
            echo "=== league $L, coverage ==="
            curl -s --max-time 20 "https://v3.football.api-sports.io/leagues?id=$L" \
              -H "x-apisports-key: ${API_FOOTBALL_KEY}" | node -e '
                let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                  let j;try{j=JSON.parse(d)}catch{console.log("  unreadable answer");process.exit(0)}
                  if(j.errors&&Object.keys(j.errors).length)console.log("  errors: "+JSON.stringify(j.errors));
                  const r=(j.response||[])[0];
                  if(!r){console.log("  the API knows no such league");process.exit(0)}
                  console.log("  "+r.league.name+" ("+r.country.name+")");
                  const current=(r.seasons||[]).find(s=>s.current)||(r.seasons||[]).at(-1)||{};
                  const c=current.coverage||{};
                  console.log("  season "+current.year+"  "+current.start+" to "+current.end);
                  console.log("  LIVE COVERAGE: "+(c.fixtures?.events?"events yes":"events NO")
                    +" | lineups "+(c.fixtures?.lineups?"yes":"no")
                    +" | statistics "+(c.fixtures?.statistics_fixtures?"yes":"no")
                    +" | standings "+(c.standings?"yes":"no"));
                })'
            echo
            echo "=== what it reports for $TODAY ==="
            curl -s --max-time 20 "https://v3.football.api-sports.io/fixtures?date=$TODAY&league=$L&season=2026" \
              -H "x-apisports-key: ${API_FOOTBALL_KEY}" | node -e '
                let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                  let j;try{j=JSON.parse(d)}catch{console.log("  unreadable answer");process.exit(0)}
                  if(j.errors&&Object.keys(j.errors).length)console.log("  errors: "+JSON.stringify(j.errors));
                  const rows=j.response||[];
                  if(!rows.length){console.log("  no fixture today");process.exit(0)}
                  for(const f of rows){
                    const st=f.fixture.status;
                    console.log("  "+f.teams.home.name+" "+(f.goals.home??"-")+" : "+(f.goals.away??"-")+" "+f.teams.away.name);
                    console.log("    kickoff "+f.fixture.date+"  status "+st.short+" ("+st.long+")  elapsed "+(st.elapsed??"-"));
                  }
                })'
          } > league.txt 2>&1 || true
          cat league.txt

      - name: Collect the report
        run: |
          {
            echo "# Audit of https://aifootball.am"
            echo "# $(date -u +'%Y-%m-%d %H:%M UTC'), commit ${GITHUB_SHA:0:7}"
            echo
            cat add-source-result.txt 2>/dev/null || echo "(audit.mjs produced nothing)"
            echo
            echo "=============================================="
            cat weight.txt 2>/dev/null || true
            echo
            echo "=============================================="
            cat vitals.txt 2>/dev/null || true
            echo
            echo "=============================================="
            cat a11y.txt 2>/dev/null || true
            echo
            echo "=============================================="
            cat league.txt 2>/dev/null || true
            echo
            echo "--- screenshots produced ---"
            ls -la audit 2>&1 || true
          } > audit-result.txt
          cat audit-result.txt

      # Pushed to check-logs, the branch this repository already uses for
      # diagnostic output, so the report can be read with git rather than
      # downloaded from the run page.
      - name: Publish the report
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # Commit the report onto an orphan tree that holds nothing else.
          # Pushing the whole branch fails the moment a workflow file has
          # changed on it: GitHub refuses to let an Actions token create or
          # update a workflow, and the run is then marked failed even though
          # the work it reports on succeeded. Same fix as add-source.yml.
          git checkout -q --orphan report-tree
          git reset -q
          git add -f audit-result.txt audit 2>/dev/null || git add -f audit-result.txt
          git commit -m "Audit report [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
