name: Verify Pro Plan

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-pro.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check plan status
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          curl -s "https://v3.football.api-sports.io/status" -H "x-apisports-key: ${AFKEY}" > pro-check.txt
          echo "" >> pro-check.txt
          echo "=== Standings with season now ===" >> pro-check.txt
          curl -s "https://v3.football.api-sports.io/standings?league=39&season=2026" -H "x-apisports-key: ${AFKEY}" | head -c 500 >> pro-check.txt
          echo "" >> pro-check.txt
          echo "=== Armenia leagues ===" >> pro-check.txt
          curl -s "https://v3.football.api-sports.io/leagues?country=Armenia" -H "x-apisports-key: ${AFKEY}" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for item in d.get('response',[]):
    print(item['league']['id'], item['league']['name'], item['league']['type'])
" >> pro-check.txt
          echo "" >> pro-check.txt
          echo "=== England cups ===" >> pro-check.txt
          curl -s "https://v3.football.api-sports.io/leagues?country=England" -H "x-apisports-key: ${AFKEY}" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for item in d.get('response',[]):
    if item['league']['type']=='Cup': print(item['league']['id'], item['league']['name'])
" >> pro-check.txt
          echo "" >> pro-check.txt
          echo "=== Spain/Italy/Germany/France cups ===" >> pro-check.txt
          for C in Spain Italy Germany France; do
            curl -s "https://v3.football.api-sports.io/leagues?country=$C" -H "x-apisports-key: ${AFKEY}" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for item in d.get('response',[]):
    if item['league']['type']=='Cup': print(item['league']['id'], item['league']['name'])
" >> pro-check.txt
          done
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f pro-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
