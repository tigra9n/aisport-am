name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the parser fix and the new minimum-gap rule
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          echo "=== A) RECENT ARTICLES WITH THE GAP SINCE THE PREVIOUS ONE ===" > ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT id, substr(published_at,12,5) AS at, CAST((julianday(published_at) - julianday(LAG(published_at) OVER (ORDER BY published_at))) * 1440 AS INT) AS gap_min, substr(title,1,42) AS title FROM articles WHERE published_at >= datetime('now','-30 hours') ORDER BY published_at DESC LIMIT 30;" >> ../add-source-result.txt 2>&1 || true
          echo "=== B) LAST 30 INVOCATIONS ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT substr(ts,12,8) AS at, generated, reason FROM cron_invocations ORDER BY id DESC LIMIT 30;" >> ../add-source-result.txt 2>&1 || true
          echo "=== C) LAST 5 INVOCATIONS IN FULL ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT ts, generated, reason, substr(log,1,1600) AS log FROM cron_invocations ORDER BY id DESC LIMIT 5;" >> ../add-source-result.txt 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
