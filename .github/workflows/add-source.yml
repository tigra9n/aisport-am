name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test which entity names APITube actually recognizes
        run: |
          {
            echo "=== org: Apple,Google,Microsoft (known-good per their docs) ==="
            curl -s --max-time 15 "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&organization.name=Apple,Google,Microsoft&per_page=3" | head -c 300
            echo ""
            echo "=== org: Manchester United ==="
            curl -s --max-time 15 "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&organization.name=Manchester United&per_page=3" | head -c 300
            echo ""
            echo "=== org: FC Barcelona ==="
            curl -s --max-time 15 "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&organization.name=FC Barcelona&per_page=3" | head -c 300
            echo ""
            echo "=== org: Barcelona ==="
            curl -s --max-time 15 "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&organization.name=Barcelona&per_page=3" | head -c 300
            echo ""
            echo "=== person: Lionel Messi ==="
            curl -s --max-time 15 "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&person.name=Lionel Messi&per_page=3" | head -c 300
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
