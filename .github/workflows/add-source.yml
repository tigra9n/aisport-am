name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles and live status
        working-directory: aisport-am
        run: |
          echo "---testing person.name query directly (Erling Haaland)---" > ../add-source-result.txt
          curl -s "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&person.name=Erling%20Haaland&published_at.start=2026-08-28&per_page=50&language.code=en&sort.by=published_at&sort.order=desc" | python3 -c "
import json,sys
d = json.load(sys.stdin)
print('status:', d.get('status'))
print('num results:', len(d.get('results', [])))
for r in d.get('results', [])[:3]:
    print('-', r.get('title'), '|', r.get('href'))
if 'errors' in d:
    print('errors:', d['errors'])
" >> ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
