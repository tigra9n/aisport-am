          const wrong = ["Տոտտենհամ", "Նեվկաստլե", "Ունիտեդ", "Րեդ", "Ագֆ", "Ոֆի", "Ֆկ Կոլոգնե"];
          const stillWrong = wrong.filter((w) => st.html.includes(w) || live.html.includes(w));
          say(`  old misspellings still on the site: ${stillWrong.join(", ") || "none"}`);

