name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          echo "---SAUDI---" > ../add-source-result.txt
          curl -s "https://v3.football.api-sports.io/leagues?search=Saudi" -H "x-apisports-key: ${API_FOOTBALL_KEY}" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['league']['id'], r['league']['name'], r['league']['type'], r['country']['name']) for r in d['response']]" >> ../add-source-result.txt
          echo "---MLS---" >> ../add-source-result.txt
          curl -s "https://v3.football.api-sports.io/leagues?search=MLS" -H "x-apisports-key: ${API_FOOTBALL_KEY}" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['league']['id'], r['league']['name'], r['league']['type'], r['country']['name']) for r in d['response']]" >> ../add-source-result.txt
          echo "---Major League Soccer (full name fallback)---" >> ../add-source-result.txt
          curl -s "https://v3.football.api-sports.io/leagues?search=Major%20League%20Soccer" -H "x-apisports-key: ${API_FOOTBALL_KEY}" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['league']['id'], r['league']['name'], r['league']['type'], r['country']['name']) for r in d['response']]" >> ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
