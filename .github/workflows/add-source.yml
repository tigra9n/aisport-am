name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch real images and update D1
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund

          IMG9=$(curl -s --max-time 15 "https://www.espn.com/nba/story/_/id/49706703/klay-thompson-lands-heat-clearing-waivers" | grep -oE '<meta[^>]+property="og:image"[^>]+content="[^"]*"' | head -1 | grep -oE 'content="[^"]*"' | sed 's/content="//;s/"$//')
          IMG8=$(curl -s --max-time 15 "https://www.espn.com/nba/story/_/id/49641350/nba-predictions-2026-27-forecast-knicks-76ers-heat-thunder-spurs-lakers-east-west-standings" | grep -oE '<meta[^>]+property="og:image"[^>]+content="[^"]*"' | head -1 | grep -oE 'content="[^"]*"' | sed 's/content="//;s/"$//')

          echo "IMG9=$IMG9"
          echo "IMG8=$IMG8"

          {
            echo "=== fetched images ==="
            echo "id9: $IMG9"
            echo "id8: $IMG8"
            echo "=== updates ==="
            if [ -n "$IMG9" ]; then
              npx wrangler d1 execute aisport-db --remote --command "UPDATE articles SET image_url = '$IMG9' WHERE id = 9;" 2>&1
            fi
            if [ -n "$IMG8" ]; then
              npx wrangler d1 execute aisport-db --remote --command "UPDATE articles SET image_url = '$IMG8' WHERE id = 8;" 2>&1
            fi
            echo "=== verify ==="
            npx wrangler d1 execute aisport-db --remote --command "SELECT id, title, image_url FROM articles WHERE id IN (8,9);" 2>&1
          } > ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
