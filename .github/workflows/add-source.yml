name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          curl -s "https://v3.football.api-sports.io/teams?league=307&season=2026" -H "x-apisports-key: ${API_FOOTBALL_KEY}" > /tmp/saudi.json
          echo "---SAUDI TEAMS---" > ../add-source-result.txt
          jq -r '.response[].team.name' /tmp/saudi.json >> ../add-source-result.txt
          curl -s "https://v3.football.api-sports.io/teams?league=253&season=2026" -H "x-apisports-key: ${API_FOOTBALL_KEY}" > /tmp/mls.json
          echo "---MLS TEAMS---" >> ../add-source-result.txt
          jq -r '.response[].team.name' /tmp/mls.json >> ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
