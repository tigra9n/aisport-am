name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d '1 day ago' +%Y-%m-%d)
          echo "---today/yesterday fixtures, tracked leagues---" > ../add-source-result.txt
          for LID in 39 140 135 78 61 2 3 4 307 253 342; do
            curl -s "https://v3.football.api-sports.io/fixtures?league=$LID&season=2026&date=$TODAY" -H "x-apisports-key: ${API_FOOTBALL_KEY}" > /tmp/f_$LID.json
            jq -r --arg lid "$LID" '.response[] | "\(.fixture.id) league=\($lid) \(.teams.home.name) vs \(.teams.away.name) status=\(.fixture.status.short)"' /tmp/f_$LID.json >> ../add-source-result.txt
          done
          echo "---timing tests on found fixtures---" >> ../add-source-result.txt
          FIDS=$(grep -oP '^\d+' ../add-source-result.txt | head -6)
          for FID in $FIDS; do
            curl -s -o /dev/null -w "af-$FID (cold): %{time_total}s http_code:%{http_code}\n" "https://aisport.am/api/live/match/af-$FID" >> ../add-source-result.txt
            curl -s -o /dev/null -w "af-$FID (warm): %{time_total}s http_code:%{http_code}\n" "https://aisport.am/api/live/match/af-$FID" >> ../add-source-result.txt
          done
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
