name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          curl -s -X POST "https://aisport.am/api/opinions?token=GZfaXwSyo95ooQNDr714eMSv-G_0X2Vf" -H "Content-Type: application/json" -d '{"author":"Թեստ Հեղինակ","role":"Ֆուտբոլային մեկնաբան","title":"Փորձարկման հոդված 2","content":"Բովանդակություն","category":"Հայկական ֆուտբոլ","imageUrl":"https://images.unsplash.com/photo-1522778119026-d647f0596c20","videoUrl":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}' > ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
