name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that inner pages redirect to their equivalent, not the homepage
        run: |
          # Search Console warned that only some pages redirect with 301.
          # A site move loses the value of every old URL that does not land
          # on its equivalent, so test real article URLs rather than trust
          # a generic warning: each must answer 301 from the old host, name
          # the SAME path on the new host (not the homepage, which would
          # throw away the page's specific ranking), and that target must
          # then return 200.
          curl -s -m 60 -o /tmp/sitemap.xml https://aifootball.am/sitemap.xml
          {
            echo "sitemap URLs: $(grep -o '<loc>' /tmp/sitemap.xml | wc -l)"
            echo
            PASS=0; TOHOME=0; BAD=0
            # A spread across the sitemap: newest, oldest and the middle.
            URLS=$( { grep -o '<loc>[^<]*/news/[^<]*</loc>' /tmp/sitemap.xml | head -4;
                      grep -o '<loc>[^<]*/news/[^<]*</loc>' /tmp/sitemap.xml | tail -4;
                      grep -o '<loc>[^<]*/opinions/[^<]*</loc>' /tmp/sitemap.xml | head -2; } \
                    | sed 's|<loc>||; s|</loc>||' | sort -u )
            for NEW in $URLS; do
              PATH_ONLY="${NEW#https://aifootball.am}"
              OLD="https://aisport.am${PATH_ONLY}"
              CODE=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$OLD")
              TARGET=$(curl -s -m 30 -o /dev/null -w '%{redirect_url}' "$OLD")
              FINAL=$(curl -s -m 30 -L -o /dev/null -w '%{http_code}' "$OLD")
              SHORT=$(printf '%s' "$PATH_ONLY" | cut -c1-46)
              if [ "$CODE" = "301" ] && [ "$TARGET" = "$NEW" ] && [ "$FINAL" = "200" ]; then
                PASS=$((PASS+1)); echo "OK    $CODE -> same path, final 200   $SHORT"
              elif [ "$TARGET" = "https://aifootball.am/" ]; then
                TOHOME=$((TOHOME+1)); echo "HOME  $CODE -> homepage, page value lost   $SHORT"
              else
                BAD=$((BAD+1)); echo "BAD   $CODE -> $TARGET (final $FINAL)   $SHORT"
              fi
            done
            echo
            echo "same-path 301 then 200: $PASS | redirected to homepage: $TOHOME | other problem: $BAD"
          } > add-source-result.txt 2>&1 || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
