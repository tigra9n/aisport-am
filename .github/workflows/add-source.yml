name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query articles
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          {
            echo "=== football-category articles mentioning basketball keywords ==="
            npx wrangler d1 execute aisport-db --remote --command "SELECT id, title, category FROM articles WHERE category = 'Ֆուտբոլ' AND (title LIKE '%Թոմփ%' OR title LIKE '%ԴեՌոզան%' OR title LIKE '%NBA%' OR title LIKE '%բասկետբոլ%' OR title LIKE '%Բասկետբոլ%');" 2>&1
          } > ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
