name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test empty-name submission
        run: |
          {
            SLUG="ley-ompsony-ayamium-anisi-koghqin-87787400"
            echo "=== 1. empty author ==="
            curl -s -X POST "https://aisport.am/api/comments" -H "Content-Type: application/json" -d "{\"articleSlug\":\"$SLUG\",\"author\":\"\",\"body\":\"no name test\"}"
            echo ""
            echo "=== 2. missing author field entirely ==="
            curl -s -X POST "https://aisport.am/api/comments" -H "Content-Type: application/json" -d "{\"articleSlug\":\"$SLUG\",\"body\":\"no author field test\"}"
            echo ""
            echo "=== 3. whitespace-only author ==="
            curl -s -X POST "https://aisport.am/api/comments" -H "Content-Type: application/json" -d "{\"articleSlug\":\"$SLUG\",\"author\":\"   \",\"body\":\"whitespace name test\"}"
            echo ""
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
