name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check article count before short-timeout test
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          npx wrangler d1 execute aisport-db --remote --command "SELECT COUNT(*) as total FROM articles;" 2>&1 > ../add-source-result.txt || true
          echo "=== short-timeout (10s) forced call test ===" >> ../add-source-result.txt
          curl -s -w "\ncurl_exit=%{exitcode}, http=%{http_code}, time=%{time_total}s\n" --max-time 10 -G "https://aisport.am/api/cron/content" --data-urlencode "token=${{ secrets.CRON_TOKEN }}" --data-urlencode "mode=rss" --data-urlencode "_c=$(date +%s)" >> ../add-source-result.txt 2>&1 || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
