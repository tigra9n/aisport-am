name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          curl -s "https://v3.football.api-sports.io/fixtures?date=2026-08-28&league=342&season=2026" -H "x-apisports-key: ${API_FOOTBALL_KEY}" > /tmp/fx.json
          FIXTURE_ID=$(jq -r '.response[0].fixture.id // empty' /tmp/fx.json)
          echo "fixture_id=$FIXTURE_ID" > ../add-source-result.txt
          if [ -n "$FIXTURE_ID" ]; then
            MATCH_ID="af-${FIXTURE_ID}"
            echo "---cold call timing (full detail)---" >> ../add-source-result.txt
            curl -s -o /tmp/first.json -w "time_total:%{time_total}s http_code:%{http_code}\n" "https://aisport.am/api/live/match/${MATCH_ID}" >> ../add-source-result.txt
            echo "---warm call timing (full detail)---" >> ../add-source-result.txt
            curl -s -o /dev/null -w "time_total:%{time_total}s http_code:%{http_code}\n" "https://aisport.am/api/live/match/${MATCH_ID}" >> ../add-source-result.txt
          fi
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
