name: Add RSS Source

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the passing feeds into D1 (no = probe only)'
        type: choice
        options: ['no', 'yes']
        default: 'no'
      apitube:
        description: 'The APITube row: leave it as it is, switch it off, or switch it back on'
        type: choice
        options: ['leave', 'off', 'on']
        default: 'leave'

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The sources table has carried exactly one row for months - APITube -
      # which is why 92% of published articles come from it and why the
      # month costs money. The RSS half of the pipeline was never broken;
      # it simply had nothing to read. This step probes candidate feeds
      # with the SAME parser lib/feeds.ts uses, so a feed that passes here
      # is a feed the worker can actually read, and only those are written.
      - name: Probe the candidate feeds
        run: |
          cat > probe.mjs <<'JS'
          import fs from "node:fs";

          // Candidates. A feed only reaches D1 if it answers, parses as RSS
          // <item>s, and yields at least five items carrying both a title
          // and a link - the exact test fetchFeed() applies at runtime.
          const CANDIDATES = [
            ["BBC Sport Football", "https://feeds.bbci.co.uk/sport/football/rss.xml"],
            ["Sky Sports Football", "https://www.skysports.com/rss/12040"],
            ["The Guardian Football", "https://www.theguardian.com/football/rss"],
            ["ESPN Soccer", "https://www.espn.com/espn/rss/soccer/news"],
            ["Goal.com", "https://www.goal.com/feeds/en/news"],
            ["90min", "https://www.90min.com/posts.rss"],
            ["Football365", "https://www.football365.com/feed"],
            ["talkSPORT Football", "https://talksport.com/football/feed/"],
            ["Football Italia", "https://football-italia.net/feed/"],
            ["Get French Football News", "https://www.getfootballnewsfrance.com/feed/"],
            ["Marca English", "https://e00-marca.uecdn.es/rss/en/football.xml"],
            ["Football.London", "https://www.football.london/?service=rss"],
            ["Mirror Football", "https://www.mirror.co.uk/sport/football/?service=rss"],
            ["Independent Football", "https://www.independent.co.uk/sport/football/rss"],
            ["Metro Football", "https://metro.co.uk/sport/football/feed/"],
            ["Sports Mole Football", "https://www.sportsmole.co.uk/rss/football.xml"],
            ["CaughtOffside", "https://www.caughtoffside.com/feed/"],
            ["TEAMtalk", "https://www.teamtalk.com/feed"],
            ["Planet Football", "https://www.planetfootball.com/feed"],
            ["Football Espana", "https://football-espana.net/feed/"],
            ["Sports Illustrated Soccer", "https://www.si.com/rss/si_soccer.rss"],
            ["Bleacher Report World Football", "https://bleacherreport.com/articles/feed?tag_id=87"],
          ];

          // Informational only - never inserted. Armenian football is the
          // one thing an English feed list cannot cover, and it is worth
          // knowing which of these are even readable before deciding.
          const ARMENIAN_CANDIDATES = [
            ["FFA (Football Federation of Armenia)", "https://ffa.am/hy/rss/"],
            ["News.am Sport", "https://news.am/arm/rss/sport.xml"],
            ["Armenpress Sport", "https://armenpress.am/arm/rss/sport/"],
          ];

          function decodeEntities(t) {
            return t.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
                    .replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&nbsp;/g," ");
          }
          function extractTag(block, tag) {
            const c = block.match(new RegExp(`<${tag}[^>]*>\\s*<!\\[CDATA\\[([\\s\\S]*?)\\]\\]>\\s*</${tag}>`, "i"));
            if (c) return decodeEntities(c[1].trim());
            const p = block.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)</${tag}>`, "i"));
            if (p) return decodeEntities(p[1].replace(/<[^>]+>/g, "").trim());
            return null;
          }
          function extractImage(block) {
            const enc = block.match(/<enclosure\b([^>]*)\/?>/i);
            if (enc) {
              const type = enc[1].match(/type=["']([^"']+)["']/i);
              const url = enc[1].match(/url=["']([^"']+)["']/i);
              if (url && (!type || /^image/i.test(type[1]))) return url[1];
            }
            const mc = block.match(/<media:content\b[^>]*url=["']([^"']+)["']/i); if (mc) return mc[1];
            const th = block.match(/<media:thumbnail\b[^>]*url=["']([^"']+)["']/i); if (th) return th[1];
            const img = block.match(/<img\b[^>]*src=["']([^"']+)["']/i);
            return img ? img[1] : null;
          }

          async function probe(name, url) {
            const started = Date.now();
            try {
              const res = await fetch(url, {
                headers: { "User-Agent": "AIFootballBot/1.0 (+https://aifootball.am)" },
                signal: AbortSignal.timeout(20000),
              });
              const ms = Date.now() - started;
              if (!res.ok) return { name, url, ok: false, why: `HTTP ${res.status}`, ms };
              const xml = await res.text();
              const blocks = xml.match(/<item\b[\s\S]*?<\/item>/gi) ?? [];
              if (!blocks.length) {
                const atom = (xml.match(/<entry\b/gi) ?? []).length;
                // fetchFeed only understands RSS <item>. An Atom feed reads
                // as zero items at runtime, silently, so reject it here
                // rather than let it occupy a row that never produces.
                return { name, url, ok: false, why: atom ? `Atom (${atom} entries) - the parser reads <item> only` : "no <item> elements", ms };
              }
              const items = blocks.map((b) => ({
                title: extractTag(b, "title") ?? "",
                link: (extractTag(b, "link") ?? extractTag(b, "guid") ?? "").trim(),
                image: extractImage(b),
                pubDate: extractTag(b, "pubDate"),
              })).filter((i) => i.title && i.link);
              // How fresh is the feed? A feed whose newest item is days old
              // cannot feed seventeen articles a day.
              const newest = items.map((i) => Date.parse(i.pubDate ?? "")).filter((n) => !Number.isNaN(n)).sort((a, b) => b - a)[0];
              const ageH = newest ? ((Date.now() - newest) / 3600000).toFixed(1) : null;
              const withImage = items.filter((i) => i.image).length;
              // 90min answers with ninety well-formed items whose newest is
              // eleven months old, and Marca's English feed with four
              // months. Both would have had the site publishing last season
              // as today's news. A feed that carries no dates at all (Sky
              // Sports) is still accepted - fetchFeed keeps undated items
              // for the same reason.
              const stale = ageH !== null && Number(ageH) > 48;
              const ok = items.length >= 5 && !stale;
              return {
                name, url, ok, ms,
                why: stale ? `stale - newest item is ${(Number(ageH) / 24).toFixed(0)} days old` : items.length >= 5 ? "" : `only ${items.length} usable item(s)`,
                items: items.length, withImage, ageH,
                sample: items.slice(0, 2).map((i) => i.title.slice(0, 70)),
              };
            } catch (err) {
              return { name, url, ok: false, why: String(err).slice(0, 90), ms: Date.now() - started };
            }
          }

          const out = [];
          const results = await Promise.all(CANDIDATES.map(([n, u]) => probe(n, u)));
          out.push("=== candidate football feeds ===");
          for (const r of results) {
            out.push(`  ${r.ok ? "PASS" : "fail"}  ${r.name.padEnd(30)} ${r.ok ? `${r.items} items, ${r.withImage} with a picture, newest ${r.ageH ?? "?"}h old, ${r.ms}ms` : r.why}`);
            if (r.ok) for (const s of r.sample) out.push(`          ${s}`);
          }
          const passing = results.filter((r) => r.ok);
          out.push(`  --- ${passing.length} of ${results.length} usable ---`);

          out.push("");
          out.push("=== Armenian feeds (reported only, never inserted) ===");
          for (const r of await Promise.all(ARMENIAN_CANDIDATES.map(([n, u]) => probe(n, u)))) {
            out.push(`  ${r.ok ? "PASS" : "fail"}  ${r.name.padEnd(38)} ${r.ok ? `${r.items} items, newest ${r.ageH ?? "?"}h old` : r.why}`);
          }

          console.log(out.join("\n"));
          fs.writeFileSync("probe.txt", out.join("\n"));
          fs.writeFileSync("passing.json", JSON.stringify(passing.map((r) => ({ name: r.name, url: r.url })), null, 2));
          JS
          node probe.mjs

      - name: Write the passing feeds into D1
        if: ${{ github.event.inputs.apply == 'yes' }}
        run: |
          npm install --no-save wrangler@4.92.0 >/dev/null 2>&1 || true
          # INSERT OR IGNORE against the unique index on feed_url, so
          # running this twice adds nothing and removes nothing. APITube is
          # deliberately left enabled: it still writes most of the site
          # today, and the rotation in the cron route picks one source per
          # tick, so adding twenty rows already drops its share to about a
          # twentieth without turning anything off.
          node -e "
            const fs=require('fs');
            const rows=JSON.parse(fs.readFileSync('passing.json','utf8'));
            const q=(s)=>\"'\"+String(s).replace(/'/g,\"''\")+\"'\";
            const sql=rows.map(r=>'INSERT OR IGNORE INTO sources(name,feed_url,language,enabled) VALUES('+q(r.name)+','+q(r.url)+\",'en',1);\").join('\n');
            fs.writeFileSync('sources.sql', sql+'\n');
            console.log(sql.replace(/^/gm,'  '));
          "
          npx wrangler d1 execute aisport-db --remote --file=sources.sql 2>&1 | tail -20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Switched off rather than deleted. The row carries the APITube key,
      # and deleting it would mean re-entering a paid credential by hand to
      # undo a decision made in one evening; enabled=0 is read by the cron
      # route's `where(eq(sources.enabled, true))` and stops every APITube
      # request just as completely.
      #
      # What goes with it, so it is not a surprise later: the rotating
      # club/player search in lib/football-entities.ts runs only for the
      # APITube source, and that search was the only thing bringing
      # Armenian club news in. The English feeds do not carry it.
      - name: Switch the APITube source off or back on
        if: ${{ github.event.inputs.apitube != 'leave' }}
        run: |
          npm install --no-save wrangler@4.92.0 >/dev/null 2>&1 || true
          npx wrangler d1 execute aisport-db --remote --command \
            "UPDATE sources SET enabled=${{ github.event.inputs.apitube == 'on' && '1' || '0' }} WHERE feed_url LIKE '%apitube%'" 2>&1 | tail -8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: What the sources table holds now
        run: |
          npm install --no-save wrangler@4.92.0 >/dev/null 2>&1 || true
          npx wrangler d1 execute aisport-db --remote --json --command \
            "SELECT s.id, s.name, s.enabled, s.feed_url, (SELECT COUNT(*) FROM articles a WHERE a.source_name = s.name AND a.published_at > datetime('now','-7 days')) AS week FROM sources s ORDER BY s.id" \
            > srcnow.json 2>&1 || true
          node -e "
            const fs=require('fs');
            const raw=fs.readFileSync('srcnow.json','utf8');
            let rows=[];
            try{rows=JSON.parse(raw.slice(raw.indexOf('[')))[0].results||[]}catch(e){console.log(raw.slice(0,400))}
            console.log(rows.length+' source(s) configured');
            for(const r of rows){
              // Never print feed_url: the APITube key lives inside one of
              // them and this repository is public.
              let host='?'; try{host=new URL(r.feed_url).hostname}catch(e){}
              console.log('  '+(r.enabled?'on ':'OFF')+' '+String(r.week).padStart(4)+' this week  '+String(r.name).padEnd(30)+' '+host);
            }
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
