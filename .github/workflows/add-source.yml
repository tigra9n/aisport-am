name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          echo "---h2h cache (team pair 50-52, Man City-Crystal Palace)---" > ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT cache_key, LENGTH(payload) as bytes, saved_at, retry_after FROM api_cache WHERE cache_key LIKE '%h2h:50-52%';" 2>&1 >> ../add-source-result.txt || true
          echo "---form guide cache (teams 50, 52, league 39)---" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT cache_key, LENGTH(payload) as bytes FROM api_cache WHERE cache_key LIKE '%form:39%' AND (cache_key LIKE '%:50' OR cache_key LIKE '%:52');" 2>&1 >> ../add-source-result.txt || true
          echo "---all api_cache keys touching 50 or 52 as team---" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT cache_key, LENGTH(payload) as bytes FROM api_cache WHERE cache_key LIKE '%:50%' OR cache_key LIKE '%:52%' LIMIT 30;" 2>&1 >> ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
