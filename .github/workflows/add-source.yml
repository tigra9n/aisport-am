name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          echo "---MLS STANDINGS STRUCTURE---" > ../add-source-result.txt
          curl -s "https://v3.football.api-sports.io/standings?league=253&season=2026" -H "x-apisports-key: ${API_FOOTBALL_KEY}" > /tmp/mls.json
          cat > /tmp/inspect.py << 'PYEOF'
import json
with open("/tmp/mls.json") as f:
    d = json.load(f)
resp = d.get("response", [])
print("response array length:", len(resp))
for i, r in enumerate(resp):
    standings = r.get("league", {}).get("standings", [])
    print(f"response[{i}] has {len(standings)} group(s)")
    for j, g in enumerate(standings):
        names = [t["team"]["name"] for t in g[:3]]
        print(f"  group[{j}]: {len(g)} teams -", names)
PYEOF
          python3 /tmp/inspect.py >> ../add-source-result.txt
          echo "---ARMENIAN PREMIER LEAGUE SEARCH---" >> ../add-source-result.txt
          curl -s "https://v3.football.api-sports.io/leagues?search=Armenia" -H "x-apisports-key: ${API_FOOTBALL_KEY}" > /tmp/armenia.json
          cat > /tmp/armenia.py << 'PYEOF'
import json
with open("/tmp/armenia.json") as f:
    d = json.load(f)
for r in d["response"]:
    print(r["league"]["id"], r["league"]["name"], r["league"]["type"], r["country"]["name"])
PYEOF
          python3 /tmp/armenia.py >> ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
