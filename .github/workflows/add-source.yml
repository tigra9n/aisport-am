name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read cron_invocations (diagnose why the Gemini billing fallback did not fire)
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          echo "=== A) COMPACT: last 30 invocations ===" > ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT ts, mode, generated, reason, length(log) as loglen FROM cron_invocations ORDER BY id DESC LIMIT 30;" >> ../add-source-result.txt 2>&1 || true
          echo "=== B) DETAILED: last 6 invocations with full log ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT ts, mode, generated, reason, substr(log,1,3000) as log FROM cron_invocations WHERE log LIKE '%generation failed%' OR log LIKE '%BILLING%' ORDER BY id DESC LIMIT 6;" >> ../add-source-result.txt 2>&1 || true
          echo "=== C) latest articles ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT id, title, published_at FROM articles ORDER BY id DESC LIMIT 5;" >> ../add-source-result.txt 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
