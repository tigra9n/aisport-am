name: Add RSS Source

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the Armenian names, the lineup links and the image proxy
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node audit.mjs || true
          echo "" >> add-source-result.txt
          echo "--- screenshots produced ---" >> add-source-result.txt
          ls -la audit >> add-source-result.txt 2>&1 || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt audit
          git commit -m "audit result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
