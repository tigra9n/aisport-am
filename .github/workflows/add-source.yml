name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deep QA round 2 - hotlink, XSS, search
        run: |
          {
            echo "=== 1. hotlink check on other recent image sources ==="
            for url in \
              "https://images.sidearmdev.com/resize?url=https%3A%2F%2Fdxbhsrqyrr690.cloudfront.net%2Fsidearm.nextgen.sites%2Fsfajacks.com%2Fimages%2F2026%2F8%2F25%2FFB_Game_Themes_Landscape.png&width=1600&type=jpeg" \
              "https://lemaroc360.com/uploads/articles/1787679047-t0Quu8MTWR.webp" \
              "https://assets.khelnow.com/news/uploads/2026/08/Alexandra-Eala.jpg" \
              "https://media.assettype.com/goodisonnews%2F2026-08-21%2F4y4o1kx6%2Fjack-grealish.jpg?w=1200&ar=40%3A21&auto=format%2Ccompress&ogImage=true&mode=crop&enlarge=true&overlay=false&overlay_position=bottom&overlay_width=100" \
              ; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -A "Mozilla/5.0" -e "https://aisport.am/" "$url")
              echo "$code  $url"
            done

            echo ""
            echo "=== 2. XSS test: submit comment with HTML tag ==="
            SLUG="ley-ompsony-ayamium-anisi-koghqin-87787400"
            curl -s -X POST "https://aisport.am/api/comments" -H "Content-Type: application/json" \
              -d "{\"articleSlug\":\"$SLUG\",\"author\":\"XSS Test\",\"body\":\"<script>alert(1)</script> and <b>bold</b>\"}"
            echo ""

            echo "=== 3. search endpoint check ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 15 "https://aisport.am/search?q=ֆուտբոլ"

            echo "=== 4. moderate unauthorized check ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 15 "https://aisport.am/api/comments/moderate?token=wrong-token"
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
