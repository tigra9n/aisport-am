name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify what Google will actually find
        run: |
          # Checked from a runner because the site is not reachable from
          # the agent's network. Submitting a sitemap to Search Console is
          # pointless if it 404s, is empty, or lists the wrong host, so
          # confirm all three before asking Google to crawl it.
          {
            echo "=== robots.txt ==="
            curl -s -m 30 -w "\nHTTP %{http_code} in %{time_total}s\n" https://aifootball.am/robots.txt
            echo
            echo "=== sitemap.xml: status, size, URL count ==="
            curl -s -m 60 -o /tmp/sitemap.xml -w "HTTP %{http_code} in %{time_total}s, %{size_download} bytes\n" https://aifootball.am/sitemap.xml
            echo "total <loc> entries: $(grep -o '<loc>' /tmp/sitemap.xml | wc -l)"
            echo "article URLs (/news/): $(grep -o '<loc>[^<]*/news/[^<]*</loc>' /tmp/sitemap.xml | wc -l)"
            echo "any URL still pointing at the OLD domain: $(grep -c 'aisport\.am' /tmp/sitemap.xml || true)"
            echo
            echo "=== first 3 and last 3 URLs ==="
            grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | head -3
            echo "..."
            grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | tail -3
            echo
            echo "=== does the newest article page render for a crawler? ==="
            NEWEST=$(grep -o '<loc>[^<]*/news/[^<]*</loc>' /tmp/sitemap.xml | tail -1 | sed 's|<loc>||; s|</loc>||')
            echo "testing: $NEWEST"
            curl -s -m 30 -o /tmp/article.html -w "HTTP %{http_code} in %{time_total}s, %{size_download} bytes\n" \
              -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "$NEWEST"
            echo "has <title>: $(grep -o '<title>[^<]*</title>' /tmp/article.html | head -1)"
            echo "has meta description: $(grep -o 'name="description" content="[^"]\{0,80\}' /tmp/article.html | head -1)"
            echo "has JSON-LD structured data: $(grep -c 'application/ld+json' /tmp/article.html || true)"
            echo
            echo "=== old domain behaviour (should be a permanent redirect) ==="
            curl -s -m 30 -o /dev/null -w "aisport.am -> HTTP %{http_code}, redirects to %{redirect_url}\n" https://aisport.am/
          } > ../add-source-result.txt 2>&1 || true
          cat ../add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
