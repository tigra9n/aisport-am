name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify title filter returns real results
        run: |
          {
            curl -s -G --max-time 15 "https://api.apitube.io/v1/news/everything" --data-urlencode "api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj" --data-urlencode "title=Real Madrid,FC Barcelona,Manchester United,Liverpool,Arsenal,Chelsea" --data-urlencode "per_page=10" > /tmp/resp.json
            python3 -c "
import json
d = json.load(open('/tmp/resp.json'))
results = d.get('results', [])
print('total results:', len(results))
for r in results[:6]:
    print('-', r.get('title', '')[:80])
"
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
