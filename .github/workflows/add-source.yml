name: Add RSS Source

# One-off manual utility to add a row to the `sources` table via D1,
# without needing a local wrangler setup. Edit SOURCE_NAME/SOURCE_URL
# below and push to run. Insert is idempotent (INSERT OR IGNORE on the
# unique feed_url), so re-running with the same URL is a no-op.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_NAME: "APITube Sport"
      SOURCE_LANG: "en"
      SOURCE_URL: "https://aisport.am/api/feeds/apitube?api_key=api_live_mJtfBal8Rto7RasWjxIQFWCMSV6AoCULOoCYVvvLTaCmEuWNY9cNg3&category_id=medtop:15000000&per_page=20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert source into D1
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          ESCAPED_NAME=$(printf '%s' "$SOURCE_NAME" | sed "s/'/''/g")
          ESCAPED_URL=$(printf '%s' "$SOURCE_URL" | sed "s/'/''/g")
          ESCAPED_LANG=$(printf '%s' "$SOURCE_LANG" | sed "s/'/''/g")
          {
            echo "=== delete old ==="
            npx wrangler d1 execute aisport-db --remote --command "DELETE FROM sources WHERE name = '$ESCAPED_NAME';" 2>&1
            echo "=== insert ==="
            npx wrangler d1 execute aisport-db --remote --command "INSERT OR IGNORE INTO sources (name, feed_url, language, enabled) VALUES ('$ESCAPED_NAME', '$ESCAPED_URL', '$ESCAPED_LANG', 1);" 2>&1
            echo "=== current sources ==="
            npx wrangler d1 execute aisport-db --remote --command "SELECT id, name, feed_url, enabled FROM sources;" 2>&1
          } > ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
