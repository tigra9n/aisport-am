name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify category page and metadata
        run: |
          {
            echo "=== category/football title tag ==="
            curl -s --max-time 15 "https://aisport.am/category/football" -o /tmp/cat.html
            grep -oE '<title>[^<]*</title>' /tmp/cat.html
            grep -oE '<meta name="description"[^>]*>' /tmp/cat.html

            echo "=== standings title tag ==="
            curl -s --max-time 15 "https://aisport.am/standings" | grep -oE '<title>[^<]*</title>'

            echo "=== live title tag ==="
            curl -s --max-time 15 "https://aisport.am/live" | grep -oE '<title>[^<]*</title>'
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
