name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: QA sweep - key pages, sitemap, robots
        run: |
          {
            echo "=== key pages ==="
            for path in "/" "/live" "/standings" "/armenia" "/podcasts" "/opinions" "/privacy" "/terms" "/moderate" "/search"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://aisport.am$path")
              echo "$path -> $code"
            done
            echo "=== sitemap.xml ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 15 "https://aisport.am/sitemap.xml"
            echo "=== robots.txt content ==="
            curl -s --max-time 15 "https://aisport.am/robots.txt"
            echo ""
            echo "=== favicon ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 15 "https://aisport.am/favicon.svg"
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
