name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load test - concurrent requests to homepage and article
        run: |
          {
            echo "=== 30 concurrent requests to homepage ==="
            START=$(date +%s%N)
            for i in $(seq 1 30); do
              (curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 20 "https://aisport.am/?_lt=$i" &)
            done
            wait
            END=$(date +%s%N)
            echo "wall clock: $(( (END-START)/1000000 ))ms"
          } > add-source-result.txt 2>&1 || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
