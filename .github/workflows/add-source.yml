name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read cron_invocations (timeout-fix verification)
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          {
            echo "=== SECRET PRESENCE (lengths only, no values) ==="
            echo "GEMINI_API_KEY length: ${#GEMINI_API_KEY}"
            echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"
            echo "CLOUDFLARE_PURGE_TOKEN length: ${#CLOUDFLARE_PURGE_TOKEN}"
          } > ../add-source-result.txt
          echo "=== A) COMPACT: last 40 invocations ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT ts, mode, generated, reason, length(log) as loglen FROM cron_invocations ORDER BY id DESC LIMIT 40;" >> ../add-source-result.txt 2>&1 || true
          echo "=== B) DETAILED: last 10 invocations with full log ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT ts, forced, mode, generated, reason, substr(log,1,2500) as log FROM cron_invocations ORDER BY id DESC LIMIT 10;" >> ../add-source-result.txt 2>&1 || true
          echo "=== C) latest articles ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT id, title, published_at FROM articles ORDER BY id DESC LIMIT 5;" >> ../add-source-result.txt 2>&1 || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
      - name: Measure real APITube latency (same queries the worker makes)
        working-directory: aisport-am
        run: |
          SINCE=$(date -u -d '3 days ago' +%F)
          for CLUB in "Manchester United" "Liverpool FC" "Real Madrid" "Bayern Munich" "Atletico Madrid"; do
            Q=$(printf '%s' "$CLUB" | jq -sRr @uri)
            URL="https://api.apitube.io/v1/news/everything?api_key=${APITUBE_KEY}&title=${Q}&category.id=medtop:15000000&published_at.start=${SINCE}&per_page=50&sort.by=published_at&sort.order=desc"
            OUT=$(curl -s -m 30 -o /tmp/r.json -w '%{http_code} %{time_total}' "$URL" || echo "curl-failed")
            COUNT=$(jq '.results | length' /tmp/r.json 2>/dev/null || echo "?")
            echo "APITube title=$CLUB -> http/time: $OUT, results: $COUNT" >> ../add-source-result.txt
          done
          echo "--- one person query ---" >> ../add-source-result.txt
          URL="https://api.apitube.io/v1/news/everything?api_key=${APITUBE_KEY}&person.name=Jude%20Bellingham&category.id=medtop:15000000&published_at.start=${SINCE}&per_page=50&sort.by=published_at&sort.order=desc"
          OUT=$(curl -s -m 30 -o /tmp/p.json -w '%{http_code} %{time_total}' "$URL" || echo "curl-failed")
          echo "APITube person.name=Jude Bellingham -> http/time: $OUT, results: $(jq '.results | length' /tmp/p.json 2>/dev/null || echo '?')" >> ../add-source-result.txt
          echo "--- rate limit / quota headers ---" >> ../add-source-result.txt
          curl -s -m 30 -D - -o /dev/null "$URL" | grep -iE 'ratelimit|x-request|retry-after|quota' >> ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
