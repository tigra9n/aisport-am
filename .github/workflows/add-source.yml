          say(`=== TheSportsDB Armenian table -> HTTP ${sdb.status}, ${Array.isArray(table) ? table.length : 0} rows ===`);
          if (Array.isArray(table)) for (const r of table) say(`      ${r.intRank}. ${r.strTeam}  ${r.intPoints} pts (${r.intPlayed} played)`);
