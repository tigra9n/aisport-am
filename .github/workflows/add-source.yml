name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Full SEO fix verification
        run: |
          {
            echo "=== robots.txt now ==="
            curl -s --max-time 15 "https://aisport.am/robots.txt"
            echo ""
            echo "=== sitemap.xml URL count ==="
            curl -s --max-time 15 "https://aisport.am/sitemap.xml" -o /tmp/sm.xml
            grep -oc "<loc>" /tmp/sm.xml || echo 0
            echo "=== homepage JSON-LD present? ==="
            curl -s --max-time 15 "https://aisport.am/" | grep -oc "application/ld+json" || echo 0
            echo "=== article page JSON-LD + noindex check ==="
            curl -s --max-time 15 "https://aisport.am/moderate" | grep -oE '<meta name="robots"[^>]*>'
            curl -s --max-time 15 "https://aisport.am/control" | grep -oE '<meta name="robots"[^>]*>'
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
