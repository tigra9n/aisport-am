name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          echo "---payload sizes: slow match (Crystal Palace-Man City, 1557381)---" > ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT cache_key, LENGTH(payload) as bytes FROM api_cache WHERE cache_key LIKE '%1557381%' ORDER BY bytes DESC;" 2>&1 >> ../add-source-result.txt || true
          echo "---payload sizes: fast match (Alaves-Villarreal, 1570353)---" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT cache_key, LENGTH(payload) as bytes FROM api_cache WHERE cache_key LIKE '%1570353%' ORDER BY bytes DESC;" 2>&1 >> ../add-source-result.txt || true
          echo "---timing re-test slow match, 3x---" >> ../add-source-result.txt
          for i in 1 2 3; do
            curl -s -o /dev/null -w "attempt $i: %{time_total}s\n" "https://aisport.am/api/live/match/af-1557381" >> ../add-source-result.txt
          done
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
