name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dump the seven non-Latin slugs in full
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          # Needed in full, untruncated, to compute each Latin replacement
          # and the redirect that has to keep the old URL working.
          echo "=== THE SEVEN NON-LATIN SLUGS ===" > ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT id, slug, substr(title,1,70) AS title FROM articles WHERE slug GLOB '*[^a-zA-Z0-9-]*' ORDER BY id;" >> ../add-source-result.txt 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
