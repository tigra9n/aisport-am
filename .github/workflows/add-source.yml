name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          curl -s "https://v3.football.api-sports.io/fixtures?live=all" -H "x-apisports-key: ${API_FOOTBALL_KEY}" > /tmp/live.json
          echo "---live fixture ids---" > ../add-source-result.txt
          jq -r '.response[0:8][] | "\(.fixture.id) \(.teams.home.name) vs \(.teams.away.name) league=\(.league.id)"' /tmp/live.json >> ../add-source-result.txt
          echo "---timing tests---" >> ../add-source-result.txt
          for FID in $(jq -r '.response[0:5][].fixture.id' /tmp/live.json); do
            curl -s -o /dev/null -w "af-$FID: %{time_total}s http_code:%{http_code}\n" "https://aisport.am/api/live/match/af-$FID" >> ../add-source-result.txt
          done
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
