name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check if the image URL loads
        run: |
          {
            echo "=== without referer ==="
            curl -sI --max-time 15 -A "Mozilla/5.0" "https://www.cappertek.com/images/news/twins-vs-athletics-betting-odds-free-picks-and-predictions-8-26-2026-415696.jpg" | head -5
            echo "=== with aisport.am referer ==="
            curl -sI --max-time 15 -A "Mozilla/5.0" -e "https://aisport.am/" "https://www.cappertek.com/images/news/twins-vs-athletics-betting-odds-free-picks-and-predictions-8-26-2026-415696.jpg" | head -5
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
