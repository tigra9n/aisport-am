name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert test Formula 1 article
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          {
            npx wrangler d1 execute aisport-db --remote --command "INSERT INTO articles (slug, title, excerpt, content, category, source_name, source_url, status) VALUES ('test-f1-article-verification', 'Թեստային Ֆորմուլա 1 նյութ', 'Սա category page-ի ստուգման համար ավելացված test հոդված է։', 'Սա test content է category page-ի dynamic rendering-ը ստուգելու համար։ Կջնջվի ստուգումից անմիջապես հետո։', 'Ֆորմուլա 1', 'Test', 'https://example.com/test-f1', 'published');" 2>&1
            echo "=== verify inserted ==="
            npx wrangler d1 execute aisport-db --remote --command "SELECT id, slug, category FROM articles WHERE slug = 'test-f1-article-verification';" 2>&1
          } > ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
