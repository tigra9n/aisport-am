import urllib.parse
title = 'Էբնութալիբի հեթ-թրիքը չփրկեց «Այնթրախտին». «Ունիոնը» 90+2-ին հավասարեցրեց՝ 3:3'
content = '''Բունդեսլիգայի նոր սեզոնի առաջին տուրում «Ալտե Ֆյորստերայ» մարզադաշտում «Ունիոն» Բեռլինն ու «Այնթրախտ» Ֆրանկֆուրտը գոլառատ մրցակցությունից հետո հաշիվը փակել են 3:3։ Հյուրերի բոլոր երեք գնդակների հեղինակը 11-րդ համարով հանդես եկող Յունես Էբնութալիբն էր, բայց երեք գոլն էլ բավական չեղավ երեք միավորի համար։ Խաղը երկու թիմն էլ սկսում էին նոր մարզիչներով՝ բեռլինցիների ղեկին Մաուրո Լուստրինելին էր, իսկ Ադի Հյութերը սկսում էր «արծիվների» գլխավոր մարզիչի իր երկրորդ շրջանը։ Դեբյուտներն էլ քիչ չէին. «Ունիոնի» կազմում Բունդեսլիգայում առաջին անգամ դուրս եկան Զենո վան դեն Բոսը, Միշել Աեբիշերն ու Էմանուել Լատե Լատը, Ֆրանկֆուրտի հիմնական կազմում էին Նոա Աթուբոլուն, Ռաֆայել Օնյեդիկան, Ջերեմայա Մալուզեն և Կեյտա Կոսուգին։ 3-րդ րոպեին Յոսիպ Յուրանովիչի անկյունայինից Լատե Լատը գլխով բացեց հաշիվը։ 10-րդ րոպեին Էբնութալիբը հավասարեցրեց, իսկ 51 վայրկյան անց երկրորդ գոլը խփեց Քվերֆելդի սխալից օգտվելով։ 67-րդ րոպեին երրորդ գոլով հեթ-թրիք արեց՝ դառնալով Բունդեսլիգայում հեթ-թրիք հեղինակած առաջին ֆրանկֆուրտցին Լուկա Յովիչից հետո՝ ութ տարվա ընդմիջումով։ 79-րդ րոպեին Քվերֆելդը կրճատեց հաշիվը, փոխհատուցման երկրորդ րոպեին Թիմ Սկարկեն կրունկով հավասարեցրեց՝ 3:3։ Ունիոնի xG-ն 2.56 էր, Այնթրախտինը՝ 1.45։ Լավագույն խաղացող ընտրվեց Էբնութալիբը 75 տոկոսով։'''
params = {'token': 'GZfaXwSyo95ooQNDr714eMSv-G_0X2Vf', 'title': title, 'content': content}
print(urllib.parse.urlencode(params))
" > /tmp/qs.txt
          curl -s --max-time 60 "https://aifootball.am/api/debug/regenerate?$(cat /tmp/qs.txt)" >> ../add-source-result.txt
