          // ESPN for a match that has finished, then open ours.
          let played = null;
          for (const slug of ["eng.1", "esp.1", "ita.1", "ger.1", "usa.1"]) {
            const d = new Date(Date.now() - 36 * 3600 * 1000).toISOString().slice(0, 10).replace(/-/g, "");
            const r = await get(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${slug}/scoreboard?dates=${d}`);
            let events = [];
            try { events = JSON.parse(r.html).events ?? []; } catch { /* an Akamai denial is HTML */ }
            const done = events.find((e) => e && e.status && e.status.type && e.status.type.completed);
            if (done) { played = `espn-${slug}-${done.id}`; break; }
          }
          if (played) {
            const m = await get(`https://aifootball.am/live/match/${played}`);
            say("");
            say(`=== /live/match/${played} (a finished match) -> HTTP ${m.status}, ${m.html.length} bytes ===`);
            say(`  lineup blocks: ${count(m.html, /Կազմ|Մեկնարկային/g)}`);
            say(`  named players: ${count(m.html, /class="[^"]*lineup[^"]*"/g)}`);
            say(`  statistics rows: ${count(m.html, /stat-bar-row|Տիրապետում|Հարվածներ/g)}`);
            say(`  events: ${count(m.html, /Գոլ|Դեղին|Կարմիր|Փոխարինում/g)}`);
            say(`  commentary lines: ${count(m.html, /commentary-item|commentary-list/g)}`);
            for (const empty of ["Կազմերը հասանելի չեն", "Վիճակագրություն չկա", "տվյալ չկա", "չի գտնվել"]) {
