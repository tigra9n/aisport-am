name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: QA sweep - check key pages
        run: |
          {
            for path in "/" "/live" "/standings" "/armenia" "/podcasts" "/opinions" "/privacy" "/terms" "/moderate" "/search"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://aisport.am$path")
              echo "$path -> $code"
            done
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
