name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check site reachability
        run: |
          {
            echo "=== HTTPS check ==="
            curl -s -v --max-time 20 "https://aisport.am/" -o /tmp/body.html 2>&1 | grep -E "HTTP|SSL|subject|issuer|expire" | head -30
            echo "=== http code ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 20 "https://aisport.am/"
            echo "=== body size ==="
            wc -c /tmp/body.html
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
