name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deep QA round 3 - control page exposure, 404 handling, headers
        run: |
          {
            echo "=== 1. is /control publicly accessible? ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 15 "https://aisport.am/control"
            curl -s --max-time 15 "https://aisport.am/control" | head -c 500
            echo ""

            echo "=== 2. 404 handling for fake article ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 15 "https://aisport.am/news/this-does-not-exist-12345"

            echo "=== 3. response headers (caching, compression) on homepage ==="
            curl -sI --max-time 15 "https://aisport.am/" | grep -iE "cache-control|content-encoding|x-frame|content-security"

            echo "=== 4. homepage og:image present? ==="
            curl -s --max-time 15 "https://aisport.am/" | grep -oE '<meta[^>]*og:image[^>]*>' | head -3

            echo "=== 5. viewport meta tag (mobile) ==="
            curl -s --max-time 15 "https://aisport.am/" | grep -oE '<meta[^>]*viewport[^>]*>'

            echo "=== 6. automation status/run API exposure ==="
            curl -s -o /dev/null -w "http_code=%{http_code}\n" --max-time 15 "https://aisport.am/api/automation/status"
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
