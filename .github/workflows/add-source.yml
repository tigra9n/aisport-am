name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check category distribution for related articles debugging
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          {
            npx wrangler d1 execute aisport-db --remote --command "SELECT category, COUNT(*) as cnt FROM articles WHERE status='published' GROUP BY category ORDER BY cnt DESC;" 2>&1
            echo "=== this specific article's category ==="
            npx wrangler d1 execute aisport-db --remote --command "SELECT slug, category FROM articles WHERE slug = 'chalkhanoghlui-paymanagri-hartsy-larvatsutyun-e-steghtsel-14844251';" 2>&1
          } > ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
