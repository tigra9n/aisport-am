name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          echo "---title=Real Madrid + single domain marca.com---" > ../add-source-result.txt
          curl -s "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&title=Real%20Madrid&source.domain=marca.com&per_page=10" > /tmp/single.json
          jq '.results | length' /tmp/single.json >> ../add-source-result.txt
          jq '.status,.message' /tmp/single.json >> ../add-source-result.txt 2>&1 || true
          echo "---title=Real Madrid + source.domain.url=marca.com (alt param name)---" >> ../add-source-result.txt
          curl -s "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&title=Real%20Madrid&source.domain.url=marca.com&per_page=10" > /tmp/alt.json
          jq '.results | length' /tmp/alt.json >> ../add-source-result.txt
          echo "---just source.domain=marca.com, no title, no category---" >> ../add-source-result.txt
          curl -s "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&source.domain=marca.com&per_page=5" > /tmp/domainonly.json
          jq '.results | length' /tmp/domainonly.json >> ../add-source-result.txt
          jq '[.results[0:2][] | {title, domain: .source.domain}]' /tmp/domainonly.json >> ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
