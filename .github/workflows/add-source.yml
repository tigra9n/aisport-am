name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get a real article slug and check related articles
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          {
            SLUG=$(npx wrangler d1 execute aisport-db --remote --command "SELECT slug FROM articles WHERE status='published' ORDER BY id DESC LIMIT 1;" 2>&1 | grep -oE '"slug": ?"[^"]*"' | head -1 | sed 's/.*"slug": *"//;s/"$//')
            echo "testing slug: $SLUG"
            curl -s --max-time 15 "https://aisport.am/news/$SLUG" -o /tmp/article.html
            echo "=== h1 count ==="
            grep -oE '<h1' /tmp/article.html | wc -l
            echo "=== related articles section ==="
            grep -oE '<h2>[^<]*ևս</h2>' /tmp/article.html
            grep -oc 'related-list' /tmp/article.html || echo "0"
          } > ../add-source-result.txt || true
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
