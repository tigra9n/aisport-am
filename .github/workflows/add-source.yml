name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          echo "---2 domains---" > ../add-source-result.txt
          curl -s "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&title=Real%20Madrid&source.domain=marca.com,skysports.com&per_page=10" > /tmp/two.json
          jq '.results | length' /tmp/two.json >> ../add-source-result.txt
          jq '.status,.message' /tmp/two.json >> ../add-source-result.txt 2>&1 || true
          echo "---2 domains, URL-ENCODED comma---" >> ../add-source-result.txt
          curl -s "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&title=Real%20Madrid&source.domain=marca.com%2Cskysports.com&per_page=10" > /tmp/twoenc.json
          jq '.results | length' /tmp/twoenc.json >> ../add-source-result.txt
          echo "---5 domains---" >> ../add-source-result.txt
          curl -s "https://api.apitube.io/v1/news/everything?api_key=api_live_IC9sMCy9vUoOAhRSTOnDCOfcvHE1GZ3M9dMzJIBT8GCyAgTVOJnOj&title=Real%20Madrid&source.domain=marca.com,skysports.com,bbc.com,espn.com,as.com&per_page=10" > /tmp/five.json
          jq '.results | length' /tmp/five.json >> ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APITUBE_KEY: ${{ secrets.APITUBE_API_KEY }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
