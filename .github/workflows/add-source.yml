name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test comments end to end
        run: |
          {
            echo "=== 1. Get an article slug ==="
            SLUG="ley-ompsony-ayamium-anisi-koghqin-87787400"
            echo "using slug=$SLUG"

            echo "=== 2. Submit a test comment ==="
            curl -s -X POST "https://aisport.am/api/comments" \
              -H "Content-Type: application/json" \
              -d "{\"articleSlug\":\"$SLUG\",\"author\":\"Test User\",\"body\":\"Test comment for moderation flow\"}"
            echo ""

            echo "=== 3. Check pending queue via moderate GET ==="
            curl -s "https://aisport.am/api/comments/moderate?token=${{ secrets.CRON_TOKEN }}"
            echo ""

            echo "=== 4. Confirm no comments show yet (still pending) ==="
            curl -s "https://aisport.am/api/comments?articleSlug=$SLUG"
            echo ""
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
