name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify control page is protected
        run: |
          {
            echo "=== without token (should show blocked message) ==="
            curl -s --max-time 15 "https://aisport.am/control" | grep -o "պաշտպանված" | head -1
            echo "=== with token (should NOT show blocked message) ==="
            curl -s --max-time 15 "https://aisport.am/control?token=GZfaXwSyo95ooQNDr714eMSv-G_0X2Vf" -o /tmp/ctrl.html
            grep -c "պաշտպանված" /tmp/ctrl.html || echo "0 (good - not blocked)"
            grep -o "Աղբյուրներ\|Վստահելի հոսքեր" /tmp/ctrl.html | head -2
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
