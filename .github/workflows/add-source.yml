name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check latest articles
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          npx wrangler d1 execute aisport-db --remote --command "SELECT COUNT(*) as total FROM articles;" 2>&1 > ../add-source-result.txt
          echo "---CATEGORY BREAKDOWN---" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT category, COUNT(*) as c FROM articles GROUP BY category ORDER BY c DESC;" 2>&1 >> ../add-source-result.txt
          echo "---RECENT 20 TITLES---" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT id, category, title, published_at, image_url FROM articles ORDER BY id DESC LIMIT 20;" 2>&1 >> ../add-source-result.txt
          echo "---DUPLICATE SLUGS CHECK---" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT slug, COUNT(*) as c FROM articles GROUP BY slug HAVING c > 1;" 2>&1 >> ../add-source-result.txt
          echo "---NULL/EMPTY IMAGE CHECK---" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT COUNT(*) as no_image FROM articles WHERE image_url IS NULL OR image_url = '';" 2>&1 >> ../add-source-result.txt
          cat ../add-source-result.txt
          cat ../add-source-result.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
