name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check site multiple times
        run: |
          {
            for i in 1 2 3 4 5; do
              echo "=== attempt $i ==="
              curl -s -o /tmp/body$i.html -w "http_code=%{http_code}, time=%{time_total}s\n" --max-time 20 "https://aisport.am/?_cb=$i-$(date +%s)"
              head -c 200 /tmp/body$i.html
              echo ""
              sleep 2
            done
          } > add-source-result.txt || true
          cat add-source-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
