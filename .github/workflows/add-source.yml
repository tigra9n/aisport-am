          // makes, so no deploy is needed to read it.
          say("");
          const api = await get(`https://aifootball.am/api/live/match/espn-eng.1-401879288`);
          say(`=== the modal's own request -> HTTP ${api.status} ===`);
          try {
            const d = JSON.parse(api.html);
            for (const key of ["events", "lineups", "statistics", "h2h", "commentary", "standings", "topScorers", "statRows", "playerLines"]) {
              const v = d[key];
              say(`  ${String(key).padEnd(12)} ${v === null || v === undefined ? "MISSING" : Array.isArray(v) ? `${v.length} row(s)` : "present"}`);
            }
            const first = Array.isArray(d.topScorers) ? d.topScorers[0] : null;
            if (first) say(`  first scorer: ${first.name} (${first.team}) ${first.goals}`);
            // The goal lines in the timeline read "Գոլ" with nobody's name
            // beside them, so print what our own events carry - the field is
            // "label", which the first version of this check got wrong and
            // then reported zero goals for a 0:2.
            const goals = (d.events ?? []).filter((e) => /Գոլ/.test(String(e.label ?? "")));
            say(`  goal events: ${goals.length} of ${(d.events ?? []).length}`);
            for (const g of goals.slice(0, 3)) say(`      ${JSON.stringify(g)}`);
            // And what ESPN sent, so a missing name can be told apart from
            // a name we threw away.
            const raw = await get("https://site.web.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event=401879288");
            try {
              const ke = JSON.parse(raw.html).keyEvents ?? [];
              say(`  ESPN keyEvents: ${ke.length}`);
              for (const e of ke.slice(0, 3)) say(`      ${JSON.stringify(e).slice(0, 300)}`);
            } catch { say("  ESPN summary did not parse"); }
          } catch {
            say(`  not json: ${api.html.slice(0, 200).replace(/\s+/g, " ")}`);
          }

          say("");
          // The smoke test cannot find a /player/ link on the scoring
          // charts, which means the chart the page opens on is empty rather
          // than that the link is shaped wrong - the club links beside it
          // were found. So read what the page says.
          const ts = await get("https://aifootball.am/topscorers");
          say(`=== /topscorers -> HTTP ${ts.status}, ${ts.html.length} bytes ===`);
          say(`  player links: ${count(ts.html, /\/player\/(?:espn-)?\d+/g)}`);
          say(`  rows: ${count(ts.html, /position-marker/g)}`);
          if (ts.html.includes("Տվյալ չկա")) say("  !! the chart says Տվյալ չկա");
          const names = [...ts.html.matchAll(/\/player\/((?:espn-)?\d+)/g)].slice(0, 3).map((m) => m[1]);
          if (names.length) say(`  first ids: ${names.join(", ")}`);

          // A club's squad: how many of its footballers have a face. The
          // photographs come from TheSportsDB and are matched on the name,
          // which is where a third of them were being lost - so count the
          // placeholders, which is what the reader sees.
          say("");
          for (const [club, id] of [["Arsenal", "espn-359"], ["Chelsea", "espn-363"], ["Liverpool", "espn-364"]]) {
            const page = await get(`https://aifootball.am/team/${id}`);
            const faces = count(page.html, /class="squad-photo"/g);
            const blanks = count(page.html, /squad-photo-placeholder/g);
            say(`  ${String(club).padEnd(10)} HTTP ${page.status}  ${faces} with a photograph, ${blanks} without`);
          }

          say("");
          // /standings takes no league query: it renders all eight leagues as
          // tabs and only the active one - the Premier League - reaches the
          // HTML. So ?league=ARM and ?league=PL both answered with twenty-one
          // rows because both answered with the Premier League, and I read
          // that as the Armenian league having twenty clubs. The rest travel
          // in the payload beside it, so read that instead.
          const st = await get("https://aifootball.am/standings");
          say(`=== /standings -> HTTP ${st.status}, ${st.html.length} bytes ===`);
          say(`  rendered rows (the active tab): ${count(st.html, /<tr/g)}`);
          for (const pair of [
            ["ARM", ["Փյունիկ", "Նոա", "Ուրարտու", "Արարատ-Արմենիա", "Ալաշկերտ", "Շիրակ"]],
            ["PL", ["Արսենալ", "Լիվերպուլ", "Տոտենհեմ", "Նյուքասլ"]],
            ["SPL", ["Ալ-Հիլալ", "Ալ-Նասր"]],
            ["MLS", ["Ինտեր Մայամի", "Լոս Անջելես Գալաքսի"]],
          ]) {
