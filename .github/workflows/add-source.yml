name: Add RSS Source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-source.yml']

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure why the hourly rate is 2 articles instead of 3
        working-directory: aisport-am
        run: |
          npm install --no-audit --no-fund
          echo "=== A) ARTICLES PER HOUR TODAY ===" > ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT substr(published_at,12,2) AS hour, COUNT(*) AS articles FROM articles WHERE published_at >= datetime('now','-14 hours') GROUP BY hour ORDER BY hour DESC;" >> ../add-source-result.txt 2>&1 || true
          echo "=== B) GAPS BETWEEN CONSECUTIVE ARTICLES ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT substr(published_at,12,5) AS at, CAST((julianday(published_at) - julianday(LAG(published_at) OVER (ORDER BY published_at))) * 1440 AS INT) AS gap_min FROM articles WHERE published_at >= datetime('now','-8 hours') ORDER BY published_at DESC;" >> ../add-source-result.txt 2>&1 || true
          echo "=== C) TICK OUTCOMES, LAST 6 HOURS, TALLIED ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT CASE WHEN reason LIKE 'only%' THEN 'waiting for the gap' ELSE reason END AS outcome, COUNT(*) AS n FROM cron_invocations WHERE ts >= strftime('%Y-%m-%dT%H:%M:%SZ','now','-6 hours') GROUP BY outcome ORDER BY n DESC;" >> ../add-source-result.txt 2>&1 || true
          echo "=== D) THE 'NOTHING FOUND' TICKS IN FULL ===" >> ../add-source-result.txt
          npx wrangler d1 execute aisport-db --remote --command "SELECT substr(ts,12,8) AS at, substr(log,1,1500) AS log FROM cron_invocations WHERE reason='nothing found' ORDER BY id DESC LIMIT 4;" >> ../add-source-result.txt 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f add-source-result.txt
          git commit -m "add-source result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
