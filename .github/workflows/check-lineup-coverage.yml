name: Check Lineup Coverage

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-lineup-coverage.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the Armenian match and raw API
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "=== Our popup for af-1581504 ===" > lineup-check.txt
          curl -s "https://aisport.am/api/live/match/af-1581504?_c=$(date +%s)" | head -c 1000 >> lineup-check.txt
          echo "" >> lineup-check.txt
          echo "=== Raw lineups endpoint for 1581504 ===" >> lineup-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures/lineups?fixture=1581504" -H "x-apisports-key: ${AFKEY}" | head -c 800 >> lineup-check.txt
          echo "" >> lineup-check.txt
          echo "=== Sample a Premier League match today ===" >> lineup-check.txt
          HTML=$(curl -s "https://aisport.am/live?_c=$(date +%s)")
          PL_ID=$(echo "$HTML" | grep -B3 "Անգլիայի Պրեմիեր լիգա" | grep -oE "af-[0-9]+" | head -1)
          echo "trying $PL_ID" >> lineup-check.txt
          curl -s "https://aisport.am/api/live/match/$PL_ID?_c=$(date +%s)" | head -c 1000 >> lineup-check.txt
          echo "" >> lineup-check.txt
          echo "=== Direct: today's PL fixtures ===" >> lineup-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures?league=39&season=2026&date=2026-08-23" -H "x-apisports-key: ${AFKEY}" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for fx in d.get('response',[]):
    print(fx['fixture']['id'], fx['teams']['home']['name'],'vs',fx['teams']['away']['name'], fx['fixture']['status']['short'])
" >> lineup-check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f lineup-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
