name: Check Lineup Coverage

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-lineup-coverage.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check coverage
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo 'import json,sys' > /tmp/fx.py
          echo 'd=json.load(sys.stdin)' >> /tmp/fx.py
          echo 'for fx in d.get("response",[]):' >> /tmp/fx.py
          echo '    print(fx["fixture"]["id"], fx["teams"]["home"]["name"],"vs",fx["teams"]["away"]["name"], fx["fixture"]["status"]["short"])' >> /tmp/fx.py

          echo "=== Today's PL fixtures ===" > lineup-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures?league=39&season=2026&date=2026-08-23" -H "x-apisports-key: ${AFKEY}" | python3 /tmp/fx.py >> lineup-check.txt
          echo "" >> lineup-check.txt
          echo "=== Lineups for Newcastle vs Liverpool (1557375, live 2H) ===" >> lineup-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures/lineups?fixture=1557375" -H "x-apisports-key: ${AFKEY}" | head -c 600 >> lineup-check.txt
          echo "" >> lineup-check.txt
          echo "=== Our popup for it ===" >> lineup-check.txt
          echo "=== Our popup summary ===" >> lineup-check.txt
          curl -s "https://aisport.am/api/live/match/af-1557375?_c=$(date +%s)" > /tmp/popup.json
          echo 'import json' > /tmp/summarize.py
          echo 'd=json.load(open("/tmp/popup.json"))' >> /tmp/summarize.py
          echo 'print("lineups count:", len(d.get("lineups",[])))' >> /tmp/summarize.py
          echo 'print("statistics count:", len(d.get("statistics",[])))' >> /tmp/summarize.py
          echo 'print("events count:", len(d.get("events",[])))' >> /tmp/summarize.py
          echo 'l=d.get("lineups",[])' >> /tmp/summarize.py
          echo 'if l: print("team:",l[0].get("team"),"formation:",l[0].get("formation"),"starters:",len(l[0].get("starters",[])))' >> /tmp/summarize.py
          python3 /tmp/summarize.py >> lineup-check.txt
          echo "" >> lineup-check.txt
          echo "=== Raw statistics for 1557375 ===" >> lineup-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures/statistics?fixture=1557375" -H "x-apisports-key: ${AFKEY}" | head -c 700 >> lineup-check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f lineup-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
