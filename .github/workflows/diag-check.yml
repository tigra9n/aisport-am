name: Diagnostic Check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-check.yml']

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test combined entity system
        run: |
          curl -s -w "\ncurl_exit=%{exitcode}, http=%{http_code}, time=%{time_total}s\n" --max-time 100 "https://aisport.am/api/cron/content?token=${{ secrets.CRON_TOKEN }}&mode=rss&_c=$(date +%s)" > diag-result.txt 2>&1 || true
          cat diag-result.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # Commit the report onto an orphan tree that holds nothing else.
          # Pushing the whole branch fails the moment a workflow file has
          # changed on it: GitHub refuses to let an Actions token create or
          # update a workflow, and the run is then marked failed even though
          # the work it reports on succeeded. Same fix as add-source.yml.
          git checkout -q --orphan report-tree
          git reset -q
          git add -f diag-result.txt
          git commit -m "diag result [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
