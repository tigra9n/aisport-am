name: Debug Form and Zone

on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-form-zone.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "=== CSS: is the pseudo-element rule actually in the deployed CSS? ===" > debug.txt
          curl -s "https://aisport.am/live?_c=$(date +%s)" -o /tmp/live.html
          grep -oE 'href="[^"]*\.css"' /tmp/live.html | sed 's/href="//;s/"$//' | sort -u > /tmp/csslinks.txt
          cat /tmp/csslinks.txt >> debug.txt
          echo "" >> debug.txt
          for CSSPATH in $(cat /tmp/csslinks.txt); do
            if [[ "$CSSPATH" == /* ]]; then
              CSSURL="https://aisport.am$CSSPATH"
            else
              CSSURL="https://aisport.am/$CSSPATH"
            fi
            echo "--- $CSSURL ---" >> debug.txt
            curl -s "$CSSURL" -o /tmp/style.css
            wc -c /tmp/style.css >> debug.txt
            grep -o ".\{0,10\}zone-ucl.\{0,120\}" /tmp/style.css | head -5 >> debug.txt
          done
          echo "" >> debug.txt
          echo "=== Raw team stats API for Newcastle (id 34) league 39 season 2026 ===" >> debug.txt
          curl -s "https://v3.football.api-sports.io/teams/statistics?league=39&season=2026&team=34" -H "x-apisports-key: ${AFKEY}" | head -c 800 >> debug.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f debug.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
