name: Check Standings Demo Issue

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-standings-demo.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check standings source
        env:
          FDTOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          echo "=== football-data.org direct ===" > sd-check.txt
          curl -s -w "\nHTTP %{http_code}\n" "https://api.football-data.org/v4/competitions/PL/standings" -H "X-Auth-Token: ${FDTOKEN}" | head -c 500 >> sd-check.txt
          echo "" >> sd-check.txt
          echo "=== Our site /standings per-league status ===" >> sd-check.txt
          curl -s "https://aisport.am/standings?_c=$(date +%s)" | grep -oE "Դեմո տվյալներ|Թարմացված" >> sd-check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f sd-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
