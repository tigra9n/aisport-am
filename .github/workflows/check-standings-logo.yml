name: Check Standings Logo

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-standings-logo.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          curl -s "https://aisport.am/standings?_c=$(date +%s)" > /tmp/s.html
          echo "=== team-badge-logo count ===" > check.txt
          grep -oc "team-badge-logo" /tmp/s.html >> check.txt
          echo "=== team-badge (letter fallback) count ===" >> check.txt
          grep -oc "class=\"team-badge\"" /tmp/s.html >> check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
