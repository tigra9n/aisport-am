name: Check Standings Logo

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-standings-logo.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          curl -s "https://aisport.am/standings?_c=$(date +%s)" > /tmp/s.html
          echo "=== team-badge-logo count ===" > check.txt
          grep -o "team-badge-logo" /tmp/s.html | wc -l >> check.txt
          echo "=== team-badge (letter fallback) count ===" >> check.txt
          grep -o "class=\"team-badge\"" /tmp/s.html | wc -l >> check.txt
          echo "=== sample of first team cell ===" >> check.txt
          grep -oE '<td>[^<]*<img[^>]*>|<td><span className="team-badge"' /tmp/s.html | head -3 >> check.txt
          grep -o 'media.api-sports.io[^"]*' /tmp/s.html | head -5 >> check.txt
          echo "=== Raw standings API response sample ===" >> check.txt
          curl -s "https://v3.football.api-sports.io/standings?league=39&season=2026" -H "x-apisports-key: ${AFKEY}" | head -c 600 >> check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
