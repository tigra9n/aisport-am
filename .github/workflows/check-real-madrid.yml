name: Check Real Madrid Match

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-real-madrid.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find Real Madrid fixture and check detail
        env:
          AFKEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "=== Real Madrid team search ===" > rm-check.txt
          curl -s "https://v3.football.api-sports.io/teams?name=Real Madrid" -H "x-apisports-key: ${AFKEY}" | head -c 400 >> rm-check.txt
          echo "" >> rm-check.txt
          echo "=== Real Madrid last fixture (team 541, La Liga 140) ===" >> rm-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures?team=541&last=1" -H "x-apisports-key: ${AFKEY}" | head -c 1200 >> rm-check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f rm-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
