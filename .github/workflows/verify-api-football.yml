name: Verify API-Football

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-api-football.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check status and leagues
        env:
          KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "=== Status ===" > af-check.txt
          curl -s "https://v3.football.api-sports.io/status" -H "x-apisports-key: $KEY" >> af-check.txt
          echo "" >> af-check.txt
          echo "=== Live fixtures (all) ===" >> af-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures?live=all" -H "x-apisports-key: $KEY" | head -c 2000 >> af-check.txt
          echo "" >> af-check.txt
          echo "=== Search leagues: Premier League ===" >> af-check.txt
          curl -s "https://v3.football.api-sports.io/leagues?name=Premier%20League&country=England" -H "x-apisports-key: $KEY" | head -c 800 >> af-check.txt
          echo "" >> af-check.txt
          echo "=== Search leagues: Champions League ===" >> af-check.txt
          curl -s "https://v3.football.api-sports.io/leagues?name=UEFA%20Champions%20League" -H "x-apisports-key: $KEY" | head -c 600 >> af-check.txt
          echo "" >> af-check.txt
          echo "=== Fixtures for today, filtered later ===" >> af-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures?date=$(date -u +%F)&league=39&season=2026" -H "x-apisports-key: $KEY" | head -c 1500 >> af-check.txt
          echo "" >> af-check.txt
          echo "=== Fixtures for today WITHOUT season param ===" >> af-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures?date=$(date -u +%F)&league=39" -H "x-apisports-key: $KEY" | head -c 1500 >> af-check.txt
          echo "" >> af-check.txt
          echo "=== Fixtures for today, no league filter at all ===" >> af-check.txt
          curl -s "https://v3.football.api-sports.io/fixtures?date=$(date -u +%F)" -H "x-apisports-key: $KEY" | head -c 400 >> af-check.txt
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f af-check.txt
          git commit -m "check [skip ci]" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:check-logs --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
